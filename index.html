<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Фразеологизмы. Знаток</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#346a48;font-family:'EB Garamond',Georgia,serif;height:100%;overflow:hidden;color:#1a2a4a}
#rotateWrap{position:fixed;top:0;left:0;width:100%;height:100%;background:#346a48;display:flex;flex-direction:column;overflow:hidden}
.header{text-align:center;padding:6px 0 4px;flex-shrink:0}
.header h1{font-family:'Playfair Display',Georgia,serif;font-size:1.6rem;font-weight:900;color:#e6b800;letter-spacing:2px;text-shadow:1px 1px 2px rgba(0,0,0,.3);margin-bottom:4px}
.instruction{font-size:.85rem;color:#d4a843;display:flex;justify-content:center;align-items:center;gap:5px;flex-wrap:wrap}
.label-phrase,.label-meaning{display:inline-block;padding:1px 7px;border-radius:4px;font-weight:700;font-size:.78rem}
.label-phrase{background:linear-gradient(180deg,#c8d8ee,#B0C4DE);color:#1a2a4a;border:1px solid #5a7a9a}
.label-meaning{background:linear-gradient(180deg,#fae8c8,#F5DEB3);color:#1a2a4a;border:1px solid #b8a060}
.tabs-row{flex-shrink:0;display:flex;justify-content:flex-start;gap:6px;padding:2px 16px 4px 16px;position:relative;z-index:2100}
.tabs-row.empty{display:none}
.tab{font-family:'EB Garamond',Georgia,serif;font-size:.8rem;font-weight:600;padding:3px 14px;background:#1a2a4a;color:#e0d4b8;border:1px solid #b8860b;border-radius:4px;cursor:pointer}
.tab.active{background:#b8860b;color:#1a2a4a}
.tab:hover{background:#2a3a5a}
.tab.active:hover{background:#c8960b;color:#1a2a4a}
.main{flex:1;display:flex;gap:10px;padding:0 16px 6px 16px;min-height:0}
.left-part{flex:0 0 63%;min-height:0;min-width:0;display:flex}
.game-field{flex:1;border:3px solid #b8860b;border-radius:8px;padding:5px;padding-bottom:11px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;min-height:0;min-width:0;position:relative;background:rgba(0,0,0,.05);overflow:visible;grid-auto-rows:minmax(0,1fr)}
.game-field .start-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Playfair Display',Georgia,serif;font-size:1rem;padding:8px 24px;background:#2a4a6a;color:#e0d4b8;border:2px solid #b8860b;border-radius:6px;cursor:pointer;z-index:10}
.game-field .start-btn:hover{background:#3a5a7a}
.tile{--edge1:#7a90ac;--edge2:#6a80a0;width:100%;height:100%;min-width:0;min-height:0;border-radius:5px 8px 8px 5px;cursor:pointer;text-align:center;font-family:'EB Garamond',Georgia,serif;font-size:1.05rem;font-weight:700;line-height:1.1;user-select:none;display:flex;align-items:center;justify-content:center;padding:2px 4px 4px 4px;overflow:hidden;position:relative;transition:box-shadow .15s,transform .15s;box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(0,0,0,.12),0 2px 0 var(--edge1),0 4px 0 var(--edge2),0 6px 6px rgba(0,0,0,.3);border:1px solid rgba(0,0,0,.15);border-bottom:none}
.tile-content{display:block;width:100%;text-align:center;line-height:1.1;overflow-wrap:normal;word-break:keep-all;hyphens:none;-webkit-hyphens:none}
.tile-content .second{color:#2a4a7a}
.tile-content .third{color:#3a6a9a}
.tile-content i{font-style:italic;font-weight:400;opacity:.85}
.tile.phrase{--edge1:#7a90ac;--edge2:#5a708c;background:linear-gradient(180deg,#cfddef,#B0C4DE 45%,#8aa0bc);color:#1a2a4a}
.tile.meaning{--edge1:#b8a070;--edge2:#9a8458;background:linear-gradient(180deg,#f8e8c8,#F5DEB3 45%,#d8c090);color:#1a2a4a}
.tile.selected{border:2px solid #b8860b;box-shadow:0 0 0 2px #b8860b,inset 0 2px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(0,0,0,.12),0 2px 0 var(--edge1),0 4px 0 var(--edge2),0 6px 6px rgba(0,0,0,.3);transform:translateY(-2px)}
.tile.correct{background:linear-gradient(180deg,#c8e6c9,#a8d5a8) !important;border:2px solid #4caf50 !important;color:#1a2a4a !important;--edge1:#6a9a6a;--edge2:#4a7a4a}
.tile.wrong{background:linear-gradient(180deg,#ffcdd2,#ef9a9a) !important;border:2px solid #c62828 !important;color:#1a2a4a !important;--edge1:#a04040;--edge2:#802020}
.tile.hidden{visibility:hidden;pointer-events:none}
@media (min-width:1100px){.tile{font-size:1.5rem}}
@media (min-width:750px) and (max-width:1099px){.tile{font-size:1.2rem}}
@media (max-width:749px){.tile{font-size:1.05rem}}
.right-column{flex:0 0 37%;display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.chest{flex:0 0 55%;display:flex;justify-content:center;align-items:stretch;padding:30px 4px 10px 4px;min-height:0}
.chest-inner{position:relative;width:92%;height:100%;perspective:600px;perspective-origin:50% 100%;overflow:visible}
.chest-body{position:absolute;bottom:0;left:0;right:0;height:75%;background:linear-gradient(180deg,#8b5a2b,#5a3414 55%,#2e1808);border:2px solid #1a0f05;border-radius:3px 3px 7px 7px;box-shadow:inset 0 3px 0 rgba(255,200,150,.18),inset 0 -8px 14px rgba(0,0,0,.6),0 6px 14px rgba(0,0,0,.55);z-index:1;overflow:hidden}
.body-wood{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 6px,rgba(0,0,0,.15) 6px,rgba(0,0,0,.15) 7px);pointer-events:none}
.body-strap-left,.body-strap-right{position:absolute;top:0;bottom:0;width:16px;background:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='28' viewBox='0 0 16 28'%3E%3Cpath d='M8 0 L8 28 M3.5 7 Q8 3.5 12.5 7 M3.5 21 Q8 24.5 12.5 21' stroke='%232a1808' fill='none' stroke-width='1.2'/%3E%3Ccircle cx='8' cy='14' r='1.4' fill='%232a1808'/%3E%3C/svg%3E"),linear-gradient(90deg,#6a4a1a,#d4a843 50%,#6a4a1a);background-repeat:repeat-y,no-repeat;background-size:100% auto,100% 100%;box-shadow:inset 0 0 0 1px rgba(40,25,5,.7),0 0 4px rgba(0,0,0,.5);border-radius:2px;z-index:2}
.body-strap-left{left:18%}.body-strap-right{right:18%}
.body-strap-bottom{position:absolute;left:0;right:0;bottom:12px;height:11px;background:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='26' height='11' viewBox='0 0 26 11'%3E%3Cpath d='M0 5.5 L26 5.5 M6 2.5 Q13 0.5 20 2.5 M6 8.5 Q13 10.5 20 8.5' stroke='%232a1808' fill='none' stroke-width='1.1'/%3E%3Ccircle cx='13' cy='5.5' r='1.3' fill='%232a1808'/%3E%3C/svg%3E"),linear-gradient(180deg,#6a4a1a,#d4a843 50%,#6a4a1a);background-repeat:repeat-x,no-repeat;background-size:auto 100%,100% 100%;box-shadow:inset 0 0 0 1px rgba(40,25,5,.7),0 0 4px rgba(0,0,0,.5);border-radius:2px;z-index:2}
.chest-lid{position:absolute;bottom:75%;left:0;right:0;height:25%;background:linear-gradient(180deg,#a06a35,#6a3e18 60%,#3a2008);border:2px solid #1a0f05;border-bottom:none;border-radius:48% 48% 0 0/88% 88% 0 0;transform-origin:50% calc(100% + 4px);transform:rotateX(0deg);transition:transform 3.2s cubic-bezier(.42,.05,.58,.95);box-shadow:inset 0 6px 0 rgba(255,200,150,.22),inset 0 -2px 8px rgba(0,0,0,.45);z-index:5;overflow:hidden}
.chest-lid.open{transform:rotateX(-65deg)}
.chest-lid.closing{transition:transform 1.2s cubic-bezier(.42,.05,.58,.95)}
.lid-wood{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 5px,rgba(0,0,0,.12) 5px,rgba(0,0,0,.12) 6px);border-radius:48% 48% 0 0/88% 88% 0 0}
.lid-strap-left,.lid-strap-right{position:absolute;top:0;bottom:0;width:16px;background:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='28' viewBox='0 0 16 28'%3E%3Cpath d='M8 0 L8 28 M3.5 7 Q8 3.5 12.5 7 M3.5 21 Q8 24.5 12.5 21' stroke='%232a1808' fill='none' stroke-width='1.2'/%3E%3Ccircle cx='8' cy='14' r='1.4' fill='%232a1808'/%3E%3C/svg%3E"),linear-gradient(90deg,#6a4a1a,#d4a843 50%,#6a4a1a);background-repeat:repeat-y,no-repeat;background-size:100% auto,100% 100%;box-shadow:inset 0 0 0 1px rgba(40,25,5,.7),0 0 4px rgba(0,0,0,.5);border-radius:2px;transition:opacity 1.6s ease}
.lid-strap-left{left:18%}.lid-strap-right{right:18%}
.chest-lid.open .lid-strap-left,.chest-lid.open .lid-strap-right{opacity:0}
.chest-lock{position:absolute;top:10%;left:50%;transform:translateX(-50%);width:34px;height:30px;background:linear-gradient(180deg,#e8bc53,#b8860b 50%,#7a5a1a);border:2px solid #2a1808;border-radius:5px;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.35),0 3px 6px rgba(0,0,0,.5);z-index:20}
.chest-lock::before{content:'';position:absolute;top:-5px;left:50%;transform:translateX(-50%);width:8px;height:6px;background:linear-gradient(180deg,#e8bc53,#b8860b);border:2px solid #2a1808;border-bottom:none;border-radius:4px 4px 0 0}
.chest-lock::after{content:'';position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:6px;height:10px;background:radial-gradient(circle at 50% 25%,#000 0 2px,#0a0400 3px);border-radius:50% 50% 2px 2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 0 2px rgba(0,0,0,.6)}
.chest-key{position:absolute;top:-16px;left:50%;transform:translateX(-50%) rotate(0deg);transform-origin:50% 16px;transition:transform 1s cubic-bezier(.45,.05,.55,.95);z-index:21}
.chest-key.turned{transform:translateX(-50%) rotate(90deg)}
.key-head{width:22px;height:22px;background:radial-gradient(circle at 40% 35%,#f8d878,#d4a843 45%,#7a5a1a);border:2px solid #2a1808;border-radius:50%;box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -2px 4px rgba(0,0,0,.3),0 2px 4px rgba(0,0,0,.55);position:relative}
.key-head::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:8px;height:8px;background:radial-gradient(circle at 40% 35%,#7a5a1a,#2a1808);border-radius:50%;box-shadow:inset 0 1px 0 rgba(0,0,0,.7)}
.key-head::after{content:'';position:absolute;top:-3px;left:50%;transform:translateX(-50%);width:3px;height:5px;background:#d4a843;border-radius:2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.book-shelf{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-height:0;min-width:0;padding:0 4px}
.book{position:relative;width:100%;flex:1;display:flex;justify-content:center;align-items:flex-end;min-height:0;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.book-open{position:relative;width:100%;height:82%;display:flex;flex-direction:column}
.book-cover{position:absolute;top:-4px;left:-4px;right:-4px;bottom:-4px;background:#1a2a4a;border-radius:4px;z-index:1}
.book-pages-edge-top,.book-pages-edge-bottom{position:absolute;left:3px;right:3px;height:4px;background:repeating-linear-gradient(to bottom,#e0d4b8,#e0d4b8 1px,#d4c8a8 1px,#d4c8a8 2px);z-index:2}
.book-pages-edge-top{top:0;border-radius:2px 2px 0 0}
.book-pages-edge-bottom{bottom:0;border-radius:0 0 2px 2px}
.book-spread{position:relative;z-index:3;display:flex;height:100%;margin:4px 3px;border-radius:2px;perspective:1600px}
.page{flex:1;min-width:0;background:#e0d4b8;background-image:radial-gradient(circle at 20% 30%,rgba(184,92,56,.1) .5px,transparent 1px),radial-gradient(circle at 70% 60%,rgba(166,138,58,.1) .5px,transparent 1px);padding:20px 10px;display:grid;grid-template-rows:repeat(4,minmax(0,1fr));gap:10px;position:relative}
.book-fold{width:6px;flex-shrink:0;background:linear-gradient(to right,#d4c8a8,#c8bc9c 30%,#b8ac8c 50%,#c8bc9c 70%,#d4c8a8);position:relative}
.book-fold::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:2px;height:100%;background:rgba(0,0,0,.15)}
.book-pair{display:flex;flex-direction:row;gap:4px;align-items:center;min-width:0;min-height:0;padding:2px 0}
.book-pair .pair-phrase{flex:0 0 45%;min-width:0;padding:1px;color:#152040;text-align:left;font-family:'EB Garamond',Georgia,serif;font-weight:700;font-size:.61rem;position:relative}
.pair-content{display:block;width:100%;text-align:left;line-height:1.15;overflow-wrap:normal;word-break:keep-all;hyphens:none;-webkit-hyphens:none}
.pair-content i{font-style:italic;font-weight:400;opacity:.85}
.book-pair .pair-phrase .lamp-inline{font-size:.7rem;margin-left:2px;cursor:pointer;flex-shrink:0}
.book-pair .pair-dash{flex:0 0 auto;display:flex;align-items:center;color:#152040;font-weight:700;padding:0 1px;font-size:.61rem}
.book-pair .pair-meaning{flex:1;min-width:0;padding:1px;color:#152040;text-align:left;font-size:.61rem;font-weight:400}
.book-pair .pair-meaning .second{color:#2a4a7a}
.book-pair .pair-meaning .third{color:#3a6a9a}
.shelf{position:relative;width:100%;height:14px;margin-top:4px;background:linear-gradient(180deg,#a0552a,#8b3a1a 15%,#6e2410 50%,#4a1408 85%,#2a0800);border-radius:3px 3px 4px 4px;box-shadow:0 2px 0 rgba(255,180,120,.25) inset,0 -2px 4px rgba(0,0,0,.4) inset,0 5px 10px rgba(0,0,0,.45),0 1px 0 rgba(160,85,42,.4)}
.shelf::before{content:'';position:absolute;top:0;left:6px;right:6px;height:2px;background:linear-gradient(90deg,transparent,rgba(255,200,150,.5),transparent);border-radius:1px}
.shelf::after{content:'';position:absolute;bottom:-3px;left:3px;right:3px;height:3px;background:linear-gradient(180deg,#3a0e04,#1a0400);border-radius:0 0 3px 3px;box-shadow:0 2px 5px rgba(0,0,0,.5)}
@keyframes flipPage{0%{transform:rotateY(0)}100%{transform:rotateY(-180deg)}}
.flip-clone{position:absolute;top:0;right:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;animation:flipPage 1.3s cubic-bezier(.45,.05,.55,.95) forwards;z-index:10;background:#e0d4b8;background-image:radial-gradient(circle at 20% 30%,rgba(184,92,56,.1) .5px,transparent 1px),radial-gradient(circle at 70% 60%,rgba(166,138,58,.1) .5px,transparent 1px);border-radius:2px;box-shadow:0 0 12px rgba(0,0,0,.3)}
.flip-clone-front{position:absolute;top:0;left:0;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:20px 10px;display:grid;grid-template-rows:repeat(4,minmax(0,1fr));gap:10px}
.footer{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:4px 16px;position:relative;z-index:2100}
.footer-buttons{display:flex;gap:6px}
.btn{font-family:'EB Garamond',Georgia,serif;font-weight:600;background:#1a2a4a;color:#e0d4b8;border:1px solid #b8860b;border-radius:5px;padding:4px 10px;font-size:.7rem;cursor:pointer}
.btn:hover{background:#2a3a5a}
.btn.muted{opacity:.6}
.watermark{color:rgba(224,212,184,.9);font-size:.65rem;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.pause-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(26,42,74,.7);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:1000}
.pause-overlay.active{display:flex}
.pause-overlay .coffee{font-size:5rem;margin-bottom:20px}
.pause-overlay .btn{font-size:1rem;padding:10px 30px}
.tooltip{position:absolute;background:#f5f0e1;border:2.5px solid #1a2a4a;border-radius:8px;padding:8px 12px;font-size:.75rem;color:#1a2a4a;z-index:3000;box-shadow:0 3px 10px rgba(0,0,0,.35);max-width:240px;line-height:1.4}
.tooltip .example{font-style:italic;color:#1a2a4a;font-weight:600}
.tooltip .warning{display:block;margin-top:3px}
.final-overlay{position:fixed;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;z-index:1500;pointer-events:none}
.final-overlay.active{display:flex}
.final-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;pointer-events:auto}
.final-book{width:400px;height:560px;background:linear-gradient(135deg,#1e3050,#0d1b3e);border-radius:10px;border:5px solid #b8860b;border-left:none;display:flex;align-items:center;justify-content:center;box-shadow:0 24px 60px rgba(0,0,0,.65),inset 0 0 80px rgba(184,134,11,.2);position:relative;cursor:pointer;animation:bookAppear .8s ease-out;margin-left:52px}
.final-book::before{content:'';position:absolute;left:-52px;top:-5px;bottom:-5px;width:56px;background:linear-gradient(90deg,#060c1c,#1a2a4a 45%,#2e4a7a 55%,#1a2a4a 100%);border:5px solid #b8860b;border-right:none;border-radius:10px 0 0 10px;box-shadow:inset -10px 0 16px rgba(0,0,0,.7),inset 0 0 12px rgba(184,134,11,.3)}
.final-book::after{content:'';position:absolute;left:-38px;top:32px;bottom:32px;width:5px;background:repeating-linear-gradient(to bottom,rgba(224,212,184,.6) 0 1px,transparent 1px 6px);border-radius:3px}
@keyframes bookAppear{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.final-book-title{font-family:'Playfair Display',Georgia,serif;font-weight:900;font-size:2.1rem;color:#b8860b;text-align:center;padding:36px;letter-spacing:1.5px;text-shadow:0 2px 4px rgba(0,0,0,.6);line-height:1.2}
.final-btn{font-family:'Playfair Display',Georgia,serif;font-size:1.15rem;padding:14px 42px;background:#4caf50;color:#fff;border:2px solid #2e7d32;border-radius:8px;cursor:pointer;box-shadow:0 4px 0 #2e7d32,0 8px 16px rgba(0,0,0,.35)}
.final-btn:hover{background:#66bb6a}
.final-btn:active{transform:translateY(2px)}
.dict-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(26,42,74,.9);display:none;align-items:center;justify-content:center;z-index:2000}
.dict-overlay.active{display:flex}
.dict-container{width:94%;max-width:960px;height:88%;background:#e0d4b8;border-radius:8px;border:4px solid #1a2a4a;display:flex;flex-direction:column;overflow:hidden;position:relative}
.dict-header{display:flex;justify-content:space-between;align-items:center;padding:6px 14px;background:#1a2a4a;color:#e0d4b8;font-family:'Playfair Display',Georgia,serif;font-size:.95rem}
.dict-close{font-size:1.2rem;cursor:pointer;color:#e0d4b8;background:none;border:none}
.dict-pages{flex:1;display:flex;overflow:visible;position:relative}
.dict-page{flex:1;position:relative;padding:14px 24px 44px 18px;overflow-y:auto;overflow-x:visible;display:flex;flex-direction:column;background:#e0d4b8;background-image:radial-gradient(circle at 20% 30%,rgba(184,92,56,.1) .5px,transparent 1px),radial-gradient(circle at 70% 60%,rgba(166,138,58,.1) .5px,transparent 1px)}
.dict-page-content{flex:1;display:flex;flex-direction:column}
.dict-fold{width:6px;flex-shrink:0;background:linear-gradient(to right,#d4c8a8,#c8bc9c 30%,#b8ac8c 50%,#c8bc9c 70%,#d4c8a8);position:relative}
.dict-fold::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:2px;height:100%;background:rgba(0,0,0,.15)}
.dict-section-title{font-family:'Playfair Display',Georgia,serif;font-weight:900;font-size:2rem;color:#c0392b;margin:6px 0 8px;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.15);letter-spacing:1px}
.dict-page .arrow{position:absolute;bottom:10px;font-size:2rem;font-weight:800;color:#e74c3c;cursor:pointer;user-select:none;line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.dict-page .arrow:hover{color:#ff6b5b}
.dict-page .arrow.disabled{color:#d0a0a0;cursor:default;text-shadow:none}
.dict-page .arrow.back{left:16px}
.dict-page .arrow.forward{right:16px}
.dict-entry{display:flex;align-items:center;gap:6px;padding:4px 0;min-height:2rem;flex:0 0 auto}
.dict-entry .lock{font-size:.85rem;flex-shrink:0;width:20px;text-align:center}
.dict-entry .entry-phrase{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:1.05rem;color:#5a2a2a;flex:0 0 40%;line-height:1.15}
.dict-entry .entry-phrase i{font-style:italic;font-weight:400;opacity:.85}

function normalizeMeaning(m){return m.toLowerCase().replace(/[;,.!?()]/g,' ').split(/\s+/).filter(w=>w.length>2).sort().join(' ');}
function meaningsAreSimilar(a,b){const n1=normalizeMeaning(a),n2=normalizeMeaning(b);if(n1===n2)return true;const w1=new Set(n1.split(' ')),w2=new Set(n2.split(' '));const i=[...w1].filter(w=>w2.has(w));const ms=Math.min(w1.size,w2.size);return ms>0&&i.length/ms>=.6;}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function buildVariants(){const p=getParams();const s=shuffle(ALL_PAIRS);const t=s.length;const tabs=p.tabs;const pr=p.pairsPerRound;const vs=Math.floor(t/tabs);const va=[];let st=0;for(let i=0;i<tabs;i++){const sz=(i===tabs-1)?(t-st):vs;va.push(s.slice(st,st+sz));st+=sz;}return va.map(v=>{const r=[];const rem=[...v];while(rem.length>0){const round=[];const used=new Set();for(let i=0;i<rem.length;i++){if(round.length>=pr)break;const c=rem[i];if(used.has(i))continue;let hc=false;for(const e of round){if(meaningsAreSimilar(c.m,e.m)){hc=true;break;}}if(!hc){round.push(c);used.add(i);}}if(round.length<pr){for(let i=0;i<rem.length;i++){if(round.length>=pr)break;if(used.has(i))continue;round.push(rem[i]);used.add(i);}}const nr=[];rem.forEach((it,i)=>{if(!used.has(i))nr.push(it);});r.push(round);rem.length=0;rem.push(...nr);}return r;});}

const SHORT_WORDS=['в','на','с','к','по','за','из','от','до','у','о','об','во','со','ко','под','над','при','про','без','для','через','между','перед','и','а','но','да','или','либо','что','как','то','же','бы','ли'];

function addNbsp(t){
  t=t.replace(/\(([^)]*)\)/g,'<i>($1)</i>');
  t=t.replace(/во что бы то ни стало/gi,'во&nbsp;что&nbsp;бы&nbsp;то<br>ни&nbsp;стало');
  t=t.replace(/несмотря ни на что/gi,'несмотря<br>ни&nbsp;на&nbsp;что');
  t=t.replace(/ни с того ни с сего/gi,'ни&nbsp;с&nbsp;того<br>ни&nbsp;с&nbsp;сего');
  SHORT_WORDS.forEach(w=>{const re=new RegExp('(^|\\s)('+w+')\\s+','gi');t=t.replace(re,'$1$2&nbsp;');});
  t=t.replace(/(^|\s)(ни|не)\s+/gi,'$1$2&nbsp;');
  t=t.replace(/(\S)-(\S)/g,'$1\u2011$2');
  t=t.replace(/один\u2011одинёшенек/g,'один-одинёшенек');
  return t;
}
function splitMeaning(m){return m.split(';').map(s=>s.trim());}
function renderMeaningHTMLStacked(m){const p=splitMeaning(m);const cl=['','second','third'];return p.map((part,i)=>{const cls=cl[i]||'third';const sep=i<p.length-1?';':'';return cls?`<span class="${cls}">${addNbsp(part)}${sep}</span>`:`<span>${addNbsp(part)}${sep}</span>`;}).join('<br>');}

  document.querySelectorAll('.tab').forEach((tab,i)=>{tab.style.display=i<deviceParams.tabs?'inline-block':'none';tab.classList.toggle('active',i===0);tab.onclick=()=>switchVariant(i);});
  const f=document.getElementById('gameField');
  f.style.gridTemplateColumns = `repeat(${deviceParams.cols}, minmax(0,1fr))`;
  f.innerHTML='<button class="start-btn" id="startBtn" onclick="startGame()">Начать игру</button>';
  document.getElementById('pageLeft').innerHTML='';
  document.getElementById('pageRight').innerHTML='';
  applyPortraitTabletLayout();
  document.getElementById('pauseOverlay').classList.remove('active');
  document.getElementById('dictOverlay').classList.remove('active');
  document.getElementById('finalOverlay').classList.remove('active');
  document.getElementById('mainArea').style.visibility='';
}

function switchVariant(i){
  syncGlobalToVariant();
  currentVariant=i;
  document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('active',j===i));
  loadVariantToGlobal(i);
  document.getElementById('finalOverlay').classList.remove('active');
  document.getElementById('dictOverlay').classList.remove('active');
  document.getElementById('mainArea').style.visibility='';
  const f=document.getElementById('gameField');
  f.style.gridTemplateColumns = `repeat(${deviceParams.cols}, minmax(0,1fr))`;
  f.innerHTML='';
  if(!gameStarted){
    f.innerHTML='<button class="start-btn" id="startBtn" onclick="startGame()">Начать игру</button>';
    document.getElementById('chestLid').classList.remove('open','closing');
    document.getElementById('chestKey').classList.remove('turned');
  }else{
    renderField(true);
    document.getElementById('chestLid').classList.add('open');
    document.getElementById('chestKey').classList.add('turned');
  }
}

function startGame(){gameStarted=true;syncGlobalToVariant();const b=document.getElementById('startBtn');if(b)b.remove();playKeyTurn();document.getElementById('chestKey').classList.add('turned');setTimeout(()=>{playChestOpen();document.getElementById('chestLid').classList.add('open');},700);setTimeout(()=>nextRound(),3200);}

function nextRound(){const r=variants[currentVariant];if(currentRound>=r.length){showFinal();return;}pairsOnField=[...r[currentRound]];remainingPairs=[...pairsOnField];const t=pairsOnField.length*2;stackRemaining=Math.max(0,stackRemaining-t);renderField();currentRound++;syncGlobalToVariant();}

function renderField(skipAnimation){
  const f=document.getElementById('gameField');
  f.innerHTML='';
  const tiles=[];
  remainingPairs.forEach(p=>{tiles.push({type:'phrase',text:p.p,pair:p});tiles.push({type:'meaning',text:p.m,pair:p});});
  let arr=shuffle(tiles);
  const cols=deviceParams.cols;
  function areNeighbors(i,j){
    const ri=Math.floor(i/cols),ci=i%cols;
    const rj=Math.floor(j/cols),cj=j%cols;
    const dr=Math.abs(ri-rj),dc=Math.abs(ci-cj);
    return (dr===1&&dc===0)||(dr===0&&dc===1);
  }
  function samePair(a,b){return a.pair===b.pair&&a.type!==b.type;}
  let guard=0;
  while(guard<3000){
    let bad=-1;
    for(let i=0;i<arr.length&&bad<0;i++){
      for(let j=i+1;j<arr.length;j++){
        if(areNeighbors(i,j)&&samePair(arr[i],arr[j])){bad=i;break;}
      }
    }
    if(bad<0)break;
    let other=Math.floor(Math.random()*arr.length);
    [arr[bad],arr[other]]=[arr[other],arr[bad]];
    guard++;
  }
  arr.forEach(d=>{
    const tile=document.createElement('div');
    tile.className='tile '+d.type;
    const inner=document.createElement('div');
    inner.className='tile-content';
    if(d.type==='phrase')inner.innerHTML=addNbsp(d.text);
    else inner.innerHTML=renderMeaningHTMLStacked(d.text);
    tile.appendChild(inner);
    tile.dataset.type=d.type;
    tile.dataset.phrase=d.pair.p;
    tile.dataset.meaning=d.pair.m;
    tile.onclick=()=>selectTile(tile);
    f.appendChild(tile);
  });
  const totalTiles=arr.length;
  const actualRows=Math.ceil(totalTiles/cols);
  const maxRows=Math.ceil((deviceParams.pairsPerRound*2)/cols);
  const gap=deviceParams.gap;
  const fieldH=f.clientHeight-2*gap-(gap+6);
  const rowHActual=(fieldH-gap*(actualRows-1))/actualRows;
  const rowHFull=(fieldH-gap*(maxRows-1))/maxRows;
  const rowH=Math.max(30, Math.min(rowHActual, rowHFull));
  f.style.gridTemplateColumns=`repeat(${cols}, minmax(0,1fr))`;
  f.style.gridTemplateRows=`repeat(${actualRows}, ${rowH}px)`;
  f.style.alignContent='start';
  fitTiles();

  if(skipAnimation)return;

  // Старт плиток — из сундука (щель под крышкой)
  const chestEl=document.getElementById('chest');
  const br=chestEl.getBoundingClientRect();
  const openX=br.left+br.width/2;
  const openY=br.top+br.height*0.3;
  const spreadW=br.width*0.25;

  const all=f.querySelectorAll('.tile');
  all.forEach(tile=>{
    const r=tile.getBoundingClientRect();
    const jitterX=(Math.random()-0.5)*spreadW;
    const jitterY=(Math.random()-0.5)*spreadW*0.4;
    const dx=(openX+jitterX)-(r.left+r.width/2);
    const dy=(openY+jitterY)-(r.top+r.height/2);
    tile.style.transform=`translate(${dx}px, ${dy}px) scale(0.15)`;
    tile.style.opacity='0';
    tile.style.transition='none';
    tile.style.zIndex='500';
    tile.style.position='relative';
  });
  playDiceDrop(all.length);

  const total=all.length;
  const stagger=Math.max(90, Math.min(220, 2400/Math.max(1,total)));
  const dur=1.35;
  setTimeout(()=>{
    all.forEach((tile,i)=>{
      setTimeout(()=>{
        tile.style.transition=`transform ${dur}s cubic-bezier(0.18,0.72,0.35,1), opacity 0.3s ease-out`;
        tile.style.transform='translate(0,0) scale(1)';
        tile.style.opacity='1';
      }, i*stagger);
    });
    const totalTime=total*stagger+dur*1000+250;
    setTimeout(()=>{
      all.forEach(tile=>{tile.style.transition='';tile.style.transform='';tile.style.opacity='';tile.style.zIndex='';tile.style.position='';});
      fitTiles();
    }, totalTime);
  }, 150);
}

function selectTile(tile){if(paused||!gameStarted||isAnimating||isFlipping)return;if(tile.classList.contains('hidden'))return;playWoodClick();document.querySelectorAll('.tile').forEach(t=>t.classList.remove('selected'));tile.classList.add('selected');if(tile.dataset.type==='phrase')selectedPhrase=tile;else selectedMeaning=tile;if(selectedPhrase&&selectedMeaning)checkPair();}

function checkPair(){if(isAnimating)return;isAnimating=true;const p=selectedPhrase,m=selectedMeaning;if(p.dataset.phrase===m.dataset.phrase){p.classList.add('correct');m.classList.add('correct');p.classList.remove('selected');m.classList.remove('selected');selectedPhrase=null;selectedMeaning=null;animateToBook(p,m);}else{p.classList.add('wrong');m.classList.add('wrong');setTimeout(()=>{p.classList.remove('wrong','selected');m.classList.remove('wrong','selected');selectedPhrase=null;selectedMeaning=null;isAnimating=false;},500);}}

function animateToBook(p,m){const br=document.querySelector('.book').getBoundingClientRect();const pr=p.getBoundingClientRect();const mr=m.getBoundingClientRect();const pc=p.cloneNode(true);const mc=m.cloneNode(true);[pc,mc].forEach((cl,i)=>{const r=i===0?pr:mr;cl.style.position='fixed';cl.style.left=r.left+'px';cl.style.top=r.top+'px';cl.style.width=r.width+'px';cl.style.height=r.height+'px';cl.style.zIndex='9999';cl.style.transition='all .5s ease-in';cl.style.pointerEvents='none';document.body.appendChild(cl);});p.style.visibility='hidden';m.style.visibility='hidden';const matchedPhrase=p.dataset.phrase;requestAnimationFrame(()=>{const tx=br.left+br.width/2,ty=br.top+br.height/2;pc.style.left=(tx-40)+'px';pc.style.top=(ty-15)+'px';pc.style.width='60px';pc.style.height='30px';pc.style.opacity='0';mc.style.left=(tx+5)+'px';mc.style.top=(ty-15)+'px';mc.style.width='60px';mc.style.height='30px';mc.style.opacity='0';});setTimeout(()=>{pc.remove();mc.remove();p.classList.add('hidden');m.classList.add('hidden');addPairToBook(p.dataset.phrase,p.dataset.meaning);collectedPhrases.add(p.dataset.phrase);remainingPairs=remainingPairs.filter(x=>x.p!==matchedPhrase);isAnimating=false;syncGlobalToVariant();const rem=document.querySelectorAll('.tile:not(.hidden)').length;if(rem===0){setTimeout(()=>nextRound(),800);}},500);}

function addPairToBook(phrase,meaning){const pl=document.getElementById('pageLeft'),pr=document.getElementById('pageRight');const pp=deviceParams.bookPairsPerPage;const pd=document.createElement('div');pd.className='book-pair';const ph=document.createElement('div');ph.className='pair-phrase';const phI=document.createElement('div');phI.className='pair-content';phI.innerHTML=addNbsp(phrase);ph.appendChild(phI);if(phrase===LAMP_PHRASE){const l=document.createElement('span');l.className='lamp-inline';l.textContent='💡';l.onclick=(e)=>{e.stopPropagation();showTooltip(l);};ph.appendChild(l);}const dh=document.createElement('div');dh.className='pair-dash';dh.textContent='—';const mh=document.createElement('div');mh.className='pair-meaning';const mhI=document.createElement('div');mhI.className='pair-content';mhI.innerHTML=renderMeaningHTMLStacked(meaning);mh.appendChild(mhI);pd.appendChild(ph);pd.appendChild(dh);pd.appendChild(mh);if(bookLeftPairs<pp){pl.appendChild(pd);bookLeftPairs++;}else if(bookRightPairs<pp){pr.appendChild(pd);bookRightPairs++;}pairsInBook.push({phrase,meaning});setTimeout(fitBook,30);syncGlobalToVariant();if(bookLeftPairs>=pp&&bookRightPairs>=pp){isFlipping=true;setTimeout(()=>{flipBookPage(()=>{pl.innerHTML='';pr.innerHTML='';bookLeftPairs=0;bookRightPairs=0;isFlipping=false;syncGlobalToVariant();});},700);}}

function flipBookPage(cb){const sp=document.getElementById('bookSpread'),rp=document.getElementById('pageRight');const rr=rp.getBoundingClientRect(),sr=sp.getBoundingClientRect();const cl=document.createElement('div');cl.className='flip-clone';cl.style.position='absolute';cl.style.left=(rr.left-sr.left)+'px';cl.style.top='0';cl.style.width=rr.width+'px';cl.style.height='100%';const fr=document.createElement('div');fr.className='flip-clone-front';fr.innerHTML=rp.innerHTML;cl.appendChild(fr);rp.innerHTML='';sp.appendChild(cl);setTimeout(()=>{cl.remove();if(cb)cb();},1300);}

function showFinal(){
  playChestClose();
  const lid=document.getElementById('chestLid');
  const key=document.getElementById('chestKey');
  lid.classList.remove('open');
  lid.classList.add('closing');
  key.classList.remove('turned');
  document.getElementById('mainArea').style.visibility='hidden';
  document.getElementById('finalOverlay').classList.add('active');
  playFanfare();
  setTimeout(()=>{lid.classList.remove('closing');},1400);
  variantState[currentVariant].gameStarted=false;
  variantState[currentVariant].round=0;
  variantState[currentVariant].pairsInBook=[];
  variantState[currentVariant].remainingPairs=[];
  variantState[currentVariant].bookLeftPairs=0;
  variantState[currentVariant].bookRightPairs=0;
  variantState[currentVariant].pageLeftHTML='';
  variantState[currentVariant].pageRightHTML='';
}

let dictPages=[],dictCurrentPage=0;
function sortKey(phrase){return phrase.replace(/^\s*\([^)]*\)\s*/,'').trim();}
function buildDictPages(){
  const sorted=[...ALL_PAIRS].sort((a,b)=>sortKey(a.p).localeCompare(sortKey(b.p),'ru'));
  const entries=[];
  let lastLetter='';
  sorted.forEach(p=>{
    const k=sortKey(p.p);
    const l=k[0].toUpperCase();
    if(l!==lastLetter){entries.push({type:'letter',letter:l});lastLetter=l;}
    entries.push({type:'pair',pair:p});
  });
  const pages=[];let cp=[],cnt=0;
  entries.forEach(e=>{cp.push(e);cnt++;if(cnt>=22){pages.push(cp);cp=[];cnt=0;}});
  if(cp.length>0)pages.push(cp);
  for(let i=0;i<pages.length-1;i++){
    const page=pages[i];
    for(let j=page.length-1;j>=0;j--){
      if(page[j].type==='letter'){
        const hasPairAfter=page.slice(j+1).some(e=>e.type==='pair');
        if(!hasPairAfter){
          const letterEntry=page.splice(j,1)[0];
          pages[i+1].unshift(letterEntry);
        }
        break;
      }
    }
  }
  dictPages=pages;
}
function capitalizeFirst(s){if(!s)return s;return s.charAt(0).toUpperCase()+s.slice(1);}
function renderDictPage(){
  const lc=document.getElementById('dictPageLeftContent'),rc=document.getElementById('dictPageRightContent');
  lc.innerHTML='';rc.innerHTML='';
  const page=dictPages[dictCurrentPage];if(!page)return;
  const half=Math.ceil(page.length/2);
  const le=page.slice(0,half),re=page.slice(half);
  [le,re].forEach((entries,side)=>{
    const ct=side===0?lc:rc;
    ct.classList.add('distribute');
    entries.forEach(entry=>{
      if(entry.type==='letter'){
        const d=document.createElement('div');
        d.className='dict-section-title';
        d.textContent=entry.letter;
        ct.appendChild(d);
      }else{
        const pair=entry.pair;
        const collected=collectedPhrases.has(pair.p);
        const d=document.createElement('div');
        d.className='dict-entry'+(collected?'':' empty');
        const lk=document.createElement('span');
        lk.className='lock';
        lk.textContent=collected?'':'🔒';
        const ph=document.createElement('span');
        ph.className='entry-phrase';
        ph.innerHTML=addNbsp(capitalizeFirst(pair.p));
        if(collected&&pair.p===LAMP_PHRASE){
          const l=document.createElement('span');
          l.className='lamp-inline';l.textContent='💡';
          l.onclick=(e)=>{e.stopPropagation();showTooltip(l);};
          ph.appendChild(l);
        }
        const dh=document.createElement('span');
        dh.className='entry-dash';dh.textContent=collected?'—':'';
        const mn=document.createElement('span');
        mn.className='entry-meaning';
        mn.innerHTML=collected?splitMeaning(pair.m).map((part,i)=>{
          const cls=['','second','third'][i]||'third';
          const sep=i<splitMeaning(pair.m).length-1?';':'';
          return `<span class="${cls}">${addNbsp(part)}${sep}</span>`;
        }).join(' '):'';
        d.appendChild(lk);d.appendChild(ph);d.appendChild(dh);d.appendChild(mn);
        ct.appendChild(d);
      }
    });
  });
  document.getElementById('dictArrowBack').classList.toggle('disabled',dictCurrentPage===0);
  document.getElementById('dictArrowForward').classList.toggle('disabled',dictCurrentPage>=dictPages.length-1);
}
function openDict(){buildDictPages();dictCurrentPage=0;renderDictPage();document.getElementById('dictOverlay').classList.add('active');}
function closeDict(){document.getElementById('dictOverlay').classList.remove('active');}
function dictPrevPage(){if(dictCurrentPage>0){dictCurrentPage--;renderDictPage();}}
function dictNextPage(){if(dictCurrentPage<dictPages.length-1){dictCurrentPage++;renderDictPage();}}

function toggleSound(){soundOn=!soundOn;const b1=document.getElementById('soundBtn');const t=soundOn?'Звук 🔊':'Звук 🔇';if(b1){b1.textContent=t;b1.classList.toggle('muted',!soundOn);}}
function togglePause(){paused=!paused;const o=document.getElementById('pauseOverlay');if(paused)o.classList.add('active');else o.classList.remove('active');}
function restartGame(){document.getElementById('finalOverlay').classList.remove('active');document.getElementById('mainArea').style.visibility='';document.getElementById('rotateWrap').style.display='flex';initGame();}

let orientationTimer = null;
function onOrientationChanged(){
  document.querySelectorAll('.flip-clone').forEach(el=>el.remove());
  isFlipping = false;
  syncGlobalToVariant();
  deviceParams = getParams();
  applyPortraitTabletLayout();
  const f = document.getElementById('gameField');
  f.style.gridTemplateColumns = `repeat(${deviceParams.cols}, minmax(0,1fr))`;
  if (gameStarted && remainingPairs.length > 0) {
    renderField(true);
    document.getElementById('chestLid').classList.add('open');
    document.getElementById('chestKey').classList.add('turned');
  } else if (!gameStarted) {
    f.innerHTML = '<button class="start-btn" id="startBtn" onclick="startGame()">Начать игру</button>';
  }
  document.getElementById('pageLeft').innerHTML = variantState[currentVariant].pageLeftHTML;
  document.getElementById('pageRight').innerHTML = variantState[currentVariant].pageRightHTML;
  setTimeout(()=>{ fitTiles(); fitBook(); }, 50);
}

const mqlPortrait = window.matchMedia('(orientation: portrait)');
function scheduleOrientationCheck(){
  clearTimeout(orientationTimer);
  orientationTimer = setTimeout(onOrientationChanged, 250);
}
if (mqlPortrait.addEventListener) mqlPortrait.addEventListener('change', scheduleOrientationCheck);
else if (mqlPortrait.addListener) mqlPortrait.addListener(scheduleOrientationCheck);

initGame();
</script>
