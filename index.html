<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Тест поворота</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#222}
  #box{
    position:fixed;top:0;left:0;
    width:100%;height:100%;
    transform-origin:top left;
    display:flex;flex-direction:column;
    font-family:monospace;font-size:20px;
  }
  .top{background:#d33;flex:1;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold}
  .mid{background:#3d3;flex:1;display:flex;align-items:center;justify-content:center;color:#111;font-weight:bold}
  .bot{background:#33d;flex:1;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold}
  #info{
    position:fixed;top:4px;left:6px;
    background:#000;color:#ff0;
    font-size:12px;padding:4px 8px;border-radius:4px;
    z-index:9999;
  }
</style>
</head>
<body>

<div id="info">загрузка…</div>

<div id="box">
  <div class="top">ВЕРХ</div>
  <div class="mid">ЦЕНТР</div>
  <div class="bot">НИЗ</div>
</div>

<script>
const box = document.getElementById('box');
const info = document.getElementById('info');

// Ориентация на момент загрузки — фиксируется
const LOCKED_LANDSCAPE = window.innerWidth >= window.innerHeight;

function apply(){
  const wi = window.innerWidth;
  const hi = window.innerHeight;
  const currentIsLandscape = wi >= hi;
  const matches = (currentIsLandscape === LOCKED_LANDSCAPE);

  box.style.transformOrigin = 'top left';

  if (matches) {
    // ориентация как при загрузке — ничего не крутим
    box.style.width = '100%';
    box.style.height = '100%';
    box.style.transform = '';
    info.textContent = 'без поворота';
  } else {
    // ориентация изменилась — компенсируем поворот браузера
    box.style.width = hi + 'px';
    box.style.height = wi + 'px';
    box.style.transform = `translate(${hi}px, 0) rotate(90deg)`;
    info.textContent = 'поворот активен';
  }
}

window.addEventListener('resize', apply);
window.addEventListener('orientationchange', () => setTimeout(apply, 100));
apply();
</script>

</body>
</html>
