<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Фразеологизмы. Знаток</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#346a48;font-family:'EB Garamond',Georgia,serif;height:100%;overflow:hidden;color:#1a2a4a}
#rotateWrap{position:fixed;top:0;left:0;width:100%;height:100%;background:#346a48;display:flex;flex-direction:column;overflow:hidden}
.header{text-align:center;padding:6px 0 4px;flex-shrink:0}
.header h1{font-family:'Playfair Display',Georgia,serif;font-size:1.6rem;font-weight:900;color:#e6b800;letter-spacing:2px;text-shadow:1px 1px 2px rgba(0,0,0,.3);margin-bottom:4px}
.instruction{font-size:.85rem;color:#d4a843;display:flex;justify-content:center;align-items:center;gap:5px;flex-wrap:wrap}
.label-phrase,.label-meaning{display:inline-block;padding:1px 7px;border-radius:4px;font-weight:700;font-size:.78rem}
.label-phrase{background:linear-gradient(180deg,#c8d8ee,#B0C4DE);color:#1a2a4a;border:1px solid #5a7a9a}
.label-meaning{background:linear-gradient(180deg,#fae8c8,#F5DEB3);color:#1a2a4a;border:1px solid #b8a060}
.tabs-row{flex-shrink:0;display:flex;justify-content:flex-start;gap:6px;padding:2px 16px 4px 16px;position:relative;z-index:3000}
.tabs-row.empty{display:none}
.tab{font-family:'EB Garamond',Georgia,serif;font-size:.8rem;font-weight:600;padding:3px 14px;background:#1a2a4a;color:#e0d4b8;border:1px solid #b8860b;border-radius:4px;cursor:pointer}
.tab.active{background:#b8860b;color:#1a2a4a}
.tab:hover{background:#2a3a5a}
.tab.active:hover{background:#c8960b;color:#1a2a4a}
.main{flex:1;display:flex;gap:10px;padding:0 16px 6px 16px;min-height:0}
.left-part{flex:0 0 63%;min-height:0;min-width:0;display:flex}
.game-field{flex:1;border:3px solid #b8860b;border-radius:8px;padding:5px;padding-bottom:11px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;min-height:0;min-width:0;position:relative;background:rgba(0,0,0,.05);overflow:visible;grid-auto-rows:minmax(0,1fr)}
.game-field .start-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Playfair Display',Georgia,serif;font-size:1rem;padding:8px 24px;background:#2a4a6a;color:#e0d4b8;border:2px solid #b8860b;border-radius:6px;cursor:pointer;z-index:10}
.game-field .start-btn:hover{background:#3a5a7a}
.tile{--edge1:#7a90ac;--edge2:#6a80a0;width:100%;height:100%;min-width:0;min-height:0;border-radius:5px 8px 8px 5px;cursor:pointer;text-align:center;font-family:'EB Garamond',Georgia,serif;font-size:1.05rem;font-weight:700;line-height:1.1;user-select:none;display:flex;align-items:center;justify-content:center;padding:2px 7px 4px 4px;overflow:hidden;position:relative;transition:box-shadow .15s,transform .15s;box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(0,0,0,.12),0 2px 0 var(--edge1),0 4px 0 var(--edge2),0 6px 6px rgba(0,0,0,.3);border:1px solid rgba(0,0,0,.15);border-bottom:none}
.tile-content{display:block;width:100%;text-align:center;line-height:1.1;overflow-wrap:normal;word-break:keep-all;hyphens:none;-webkit-hyphens:none}
.tile-content .second{color:#2a4a7a}
.tile-content .third{color:#3a6a9a}
.tile-content i{font-style:italic;font-weight:400;opacity:.85}
.tile.phrase{--edge1:#7a90ac;--edge2:#5a708c;background:linear-gradient(180deg,#cfddef,#B0C4DE 45%,#8aa0bc);color:#1a2a4a}
.tile.meaning{--edge1:#b8a070;--edge2:#9a8458;background:linear-gradient(180deg,#f8e8c8,#F5DEB3 45%,#d8c090);color:#1a2a4a}
.tile.selected{border:2px solid #b8860b;box-shadow:0 0 0 2px #b8860b,inset 0 2px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(0,0,0,.12),0 2px 0 var(--edge1),0 4px 0 var(--edge2),0 6px 6px rgba(0,0,0,.3);transform:translateY(-2px)}
.tile.correct{background:linear-gradient(180deg,#c8e6c9,#a8d5a8) !important;border:2px solid #4caf50 !important;color:#1a2a4a !important;--edge1:#6a9a6a;--edge2:#4a7a4a}
.tile.wrong{background:linear-gradient(180deg,#ffcdd2,#ef9a9a) !important;border:2px solid #c62828 !important;color:#1a2a4a !important;--edge1:#a04040;--edge2:#802020}
.tile.hidden{visibility:hidden;pointer-events:none}
@media (min-width:1100px){.tile{font-size:1.5rem}}
@media (min-width:750px) and (max-width:1099px){.tile{font-size:1.2rem}}
@media (max-width:749px){.tile{font-size:1.05rem}}
.right-column{flex:0 0 37%;display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.chest{flex:0 0 55%;display:flex;justify-content:center;align-items:stretch;padding:30px 4px 10px 4px;min-height:0}
.chest-inner{position:relative;width:92%;height:100%;perspective:600px;perspective-origin:50% 100%;overflow:visible}
.chest-body{position:absolute;bottom:0;left:0;right:0;height:75%;background:linear-gradient(180deg,#8b5a2b,#5a3414 55%,#2e1808);border:2px solid #1a0f05;border-radius:3px 3px 7px 7px;box-shadow:inset 0 3px 0 rgba(255,200,150,.18),inset 0 -8px 14px rgba(0,0,0,.6),0 6px 14px rgba(0,0,0,.55);z-index:1;overflow:hidden}
.body-wood{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 6px,rgba(0,0,0,.15) 6px,rgba(0,0,0,.15) 7px);pointer-events:none}
.body-strap-left,.body-strap-right{position:absolute;top:0;bottom:0;width:16px;background:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='28' viewBox='0 0 16 28'%3E%3Cpath d='M8 0 L8 28 M3.5 7 Q8 3.5 12.5 7 M3.5 21 Q8 24.5 12.5 21' stroke='%232a1808' fill='none' stroke-width='1.2'/%3E%3Ccircle cx='8' cy='14' r='1.4' fill='%232a1808'/%3E%3C/svg%3E"),linear-gradient(90deg,#6a4a1a,#d4a843 50%,#6a4a1a);background-repeat:repeat-y,no-repeat;background-size:100% auto,100% 100%;box-shadow:inset 0 0 0 1px rgba(40,25,5,.7),0 0 4px rgba(0,0,0,.5);border-radius:2px;z-index:2}
.body-strap-left{left:18%}.body-strap-right{right:18%}
.body-strap-bottom{position:absolute;left:0;right:0;bottom:12px;height:11px;background:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='26' height='11' viewBox='0 0 26 11'%3E%3Cpath d='M0 5.5 L26 5.5 M6 2.5 Q13 0.5 20 2.5 M6 8.5 Q13 10.5 20 8.5' stroke='%232a1808' fill='none' stroke-width='1.1'/%3E%3Ccircle cx='13' cy='5.5' r='1.3' fill='%232a1808'/%3E%3C/svg%3E"),linear-gradient(180deg,#6a4a1a,#d4a843 50%,#6a4a1a);background-repeat:repeat-x,no-repeat;background-size:auto 100%,100% 100%;box-shadow:inset 0 0 0 1px rgba(40,25,5,.7),0 0 4px rgba(0,0,0,.5);border-radius:2px;z-index:2}
.chest-lid{position:absolute;bottom:75%;left:0;right:0;height:25%;background:linear-gradient(180deg,#a06a35,#6a3e18 60%,#3a2008);border:2px solid #1a0f05;border-bottom:none;border-radius:48% 48% 0 0/88% 88% 0 0;transform-origin:50% calc(100% + 4px);transform:rotateX(0deg);transition:transform 3.2s cubic-bezier(.42,.05,.58,.95);box-shadow:inset 0 6px 0 rgba(255,200,150,.22),inset 0 -2px 8px rgba(0,0,0,.45);z-index:5;overflow:hidden}
.chest-lid.open{transform:rotateX(-65deg)}
.chest-lid.closing{transition:transform 1.2s cubic-bezier(.42,.05,.58,.95)}
.lid-wood{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 5px,rgba(0,0,0,.12) 5px,rgba(0,0,0,.12) 6px);border-radius:48% 48% 0 0/88% 88% 0 0}
.lid-strap-left,.lid-strap-right{position:absolute;top:0;bottom:0;width:16px;background:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='28' viewBox='0 0 16 28'%3E%3Cpath d='M8 0 L8 28 M3.5 7 Q8 3.5 12.5 7 M3.5 21 Q8 24.5 12.5 21' stroke='%232a1808' fill='none' stroke-width='1.2'/%3E%3Ccircle cx='8' cy='14' r='1.4' fill='%232a1808'/%3E%3C/svg%3E"),linear-gradient(90deg,#6a4a1a,#d4a843 50%,#6a4a1a);background-repeat:repeat-y,no-repeat;background-size:100% auto,100% 100%;box-shadow:inset 0 0 0 1px rgba(40,25,5,.7),0 0 4px rgba(0,0,0,.5);border-radius:2px;transition:opacity 1.6s ease}
.lid-strap-left{left:18%}.lid-strap-right{right:18%}
.chest-lid.open .lid-strap-left,.chest-lid.open .lid-strap-right{opacity:0}
.chest-lock{position:absolute;top:10%;left:50%;transform:translateX(-50%);width:34px;height:30px;background:linear-gradient(180deg,#e8bc53,#b8860b 50%,#7a5a1a);border:2px solid #2a1808;border-radius:5px;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.35),0 3px 6px rgba(0,0,0,.5);z-index:20}
.chest-lock::before{content:'';position:absolute;top:-5px;left:50%;transform:translateX(-50%);width:8px;height:6px;background:linear-gradient(180deg,#e8bc53,#b8860b);border:2px solid #2a1808;border-bottom:none;border-radius:4px 4px 0 0}
.chest-lock::after{content:'';position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:6px;height:10px;background:radial-gradient(circle at 50% 25%,#000 0 2px,#0a0400 3px);border-radius:50% 50% 2px 2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 0 2px rgba(0,0,0,.6)}
.chest-key{position:absolute;top:-16px;left:50%;transform:translateX(-50%) rotate(0deg);transform-origin:50% 16px;transition:transform 1s cubic-bezier(.45,.05,.55,.95);z-index:21}
.chest-key.turned{transform:translateX(-50%) rotate(90deg)}
.key-head{width:22px;height:22px;background:radial-gradient(circle at 40% 35%,#f8d878,#d4a843 45%,#7a5a1a);border:2px solid #2a1808;border-radius:50%;box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -2px 4px rgba(0,0,0,.3),0 2px 4px rgba(0,0,0,.55);position:relative}
.key-head::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:8px;height:8px;background:radial-gradient(circle at 40% 35%,#7a5a1a,#2a1808);border-radius:50%;box-shadow:inset 0 1px 0 rgba(0,0,0,.7)}
.key-head::after{content:'';position:absolute;top:-3px;left:50%;transform:translateX(-50%);width:3px;height:5px;background:#d4a843;border-radius:2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.book-shelf{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-height:0;min-width:0;padding:0 4px}
.book{position:relative;width:100%;flex:1;display:flex;justify-content:center;align-items:flex-end;min-height:0;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.book-open{position:relative;width:100%;height:82%;display:flex;flex-direction:column}
.book-cover{position:absolute;top:-4px;left:-4px;right:-4px;bottom:-4px;background:#1a2a4a;border-radius:4px;z-index:1}
.book-pages-edge-top,.book-pages-edge-bottom{position:absolute;left:3px;right:3px;height:4px;background:repeating-linear-gradient(to bottom,#e0d4b8,#e0d4b8 1px,#d4c8a8 1px,#d4c8a8 2px);z-index:2}
.book-pages-edge-top{top:0;border-radius:2px 2px 0 0}
.book-pages-edge-bottom{bottom:0;border-radius:0 0 2px 2px}
.book-spread{position:relative;z-index:3;display:flex;height:100%;margin:4px 3px;border-radius:2px;perspective:1600px;overflow:hidden}
.page{flex:1;min-width:0;background:#e0d4b8;background-image:radial-gradient(circle at 20% 30%,rgba(184,92,56,.1) .5px,transparent 1px),radial-gradient(circle at 70% 60%,rgba(166,138,58,.1) .5px,transparent 1px);padding:20px 10px;display:grid;grid-template-rows:repeat(4,minmax(0,1fr));gap:10px;position:relative}
.book-fold{width:6px;flex-shrink:0;background:linear-gradient(to right,#d4c8a8,#c8bc9c 30%,#b8ac8c 50%,#c8bc9c 70%,#d4c8a8);position:relative}
.book-fold::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:2px;height:100%;background:rgba(0,0,0,.15)}
.book-pair{display:flex;flex-direction:row;align-items:baseline;min-width:0;min-height:0;padding:2px 0}
.book-pair .pair-phrase{flex:0 0 45%;min-width:0;padding:1px;color:#152040;text-align:left;font-family:'EB Garamond',Georgia,serif;font-weight:700;font-size:.61rem;position:relative}
.pair-content{display:block;width:100%;text-align:left;line-height:1.15;overflow-wrap:normal;word-break:keep-all;hyphens:none;-webkit-hyphens:none}
.pair-content i{font-style:italic;font-weight:400;opacity:.85}
.book-pair .pair-phrase .lamp-inline{font-size:.7rem;margin-left:2px;cursor:pointer;flex-shrink:0}
.book-pair .pair-dash{flex:0 0 14px;display:flex;align-items:center;justify-content:center;color:#152040;font-weight:700;padding:0;font-size:.61rem}
.book-pair .pair-meaning{flex:1;min-width:0;padding:1px;color:#152040;text-align:left;font-size:.61rem;font-weight:400}
.book-pair .pair-meaning .second{color:#2a4a7a}
.book-pair .pair-meaning .third{color:#3a6a9a}
.shelf{position:relative;width:100%;height:14px;margin-top:4px;background:linear-gradient(180deg,#a0552a,#8b3a1a 15%,#6e2410 50%,#4a1408 85%,#2a0800);border-radius:3px 3px 4px 4px;box-shadow:0 2px 0 rgba(255,180,120,.25) inset,0 -2px 4px rgba(0,0,0,.4) inset,0 5px 10px rgba(0,0,0,.45),0 1px 0 rgba(160,85,42,.4)}
.shelf::before{content:'';position:absolute;top:0;left:6px;right:6px;height:2px;background:linear-gradient(90deg,transparent,rgba(255,200,150,.5),transparent);border-radius:1px}
.shelf::after{content:'';position:absolute;bottom:-3px;left:3px;right:3px;height:3px;background:linear-gradient(180deg,#3a0e04,#1a0400);border-radius:0 0 3px 3px;box-shadow:0 2px 5px rgba(0,0,0,.5)}
@keyframes flipPage{0%{transform:rotateY(0)}100%{transform:rotateY(-180deg)}}
.flip-clone{position:absolute;top:0;right:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;animation:flipPage 1.3s cubic-bezier(.45,.05,.55,.95) forwards;z-index:10;background:#e0d4b8;background-image:radial-gradient(circle at 20% 30%,rgba(184,92,56,.1) .5px,transparent 1px),radial-gradient(circle at 70% 60%,rgba(166,138,58,.1) .5px,transparent 1px);border-radius:2px;box-shadow:0 0 12px rgba(0,0,0,.3)}
.flip-clone-front{position:absolute;top:0;left:0;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:20px 10px;display:grid;grid-template-rows:repeat(4,minmax(0,1fr));gap:10px}
.flip-clone-back{position:absolute;top:0;left:0;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:rotateY(180deg);background:#e0d4b8;background-image:radial-gradient(circle at 20% 30%,rgba(184,92,56,.1) .5px,transparent 1px),radial-gradient(circle at 70% 60%,rgba(166,138,58,.1) .5px,transparent 1px);border-radius:2px}
.footer{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:4px 16px;position:relative;z-index:3000}
.footer-buttons{display:flex;gap:6px}
.btn{font-family:'EB Garamond',Georgia,serif;font-weight:600;background:#1a2a4a;color:#e0d4b8;border:1px solid #b8860b;border-radius:5px;padding:4px 10px;font-size:.7rem;cursor:pointer}
.btn:hover{background:#2a3a5a}
.btn.muted{opacity:.6}
.watermark{color:rgba(224,212,184,.9);font-size:.65rem;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.pause-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(26,42,74,.7);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:2500}
.pause-overlay.active{display:flex}
.pause-overlay .coffee{font-size:5rem;margin-bottom:20px}
.pause-overlay .btn{font-size:1rem;padding:10px 30px}
#rotateNotice{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(26,42,74,.7);z-index:9999;align-items:center;justify-content:center;text-align:center;padding:20px}
#rotateNotice.active{display:flex}
.rotate-text{font-family:'Playfair Display',Georgia,serif;font-size:1.3rem;color:#e6b800;letter-spacing:1px;line-height:1.4;max-width:280px;text-shadow:0 2px 4px rgba(0,0,0,.5)}
.tooltip{position:absolute;background:#f5f0e1;border:2.5px solid #1a2a4a;border-radius:8px;padding:8px 12px;font-size:.75rem;color:#1a2a4a;z-index:3500;box-shadow:0 3px 10px rgba(0,0,0,.35);max-width:240px;line-height:1.4}
.tooltip .example{font-style:italic;color:#1a2a4a;font-weight:600}
.tooltip .warning{display:block;margin-top:3px}
.final-overlay{position:fixed;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;z-index:1500;pointer-events:none}
.final-overlay.active{display:flex}
.final-center{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.5vh,28px);padding:10px;overflow:auto;pointer-events:none}
.final-center>*{pointer-events:auto}
.final-book{width:min(400px,58vh);height:min(560px,78vh);background:linear-gradient(135deg,#1e3050,#0d1b3e);border-radius:10px;border:5px solid #b8860b;border-left:none;display:flex;align-items:center;justify-content:center;box-shadow:0 24px 60px rgba(0,0,0,.65),inset 0 0 80px rgba(184,134,11,.2);position:relative;cursor:pointer;animation:bookAppear .8s ease-out;margin-left:calc(min(400px,58vh)*0.13);flex-shrink:0}
.final-book::before{content:'';position:absolute;left:calc(-1*min(400px,58vh)*0.13);top:-5px;bottom:-5px;width:calc(min(400px,58vh)*0.14);background:linear-gradient(90deg,#060c1c,#1a2a4a 45%,#2e4a7a 55%,#1a2a4a 100%);border:5px solid #b8860b;border-right:none;border-radius:10px 0 0 10px;box-shadow:inset -10px 0 16px rgba(0,0,0,.7),inset 0 0 12px rgba(184,134,11,.3)}
.final-book::after{content:'';position:absolute;left:calc(-1*min(400px,58vh)*0.095);top:32px;bottom:32px;width:5px;background:repeating-linear-gradient(to bottom,rgba(224,212,184,.6) 0 1px,transparent 1px 6px);border-radius:3px}
@keyframes bookAppear{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.final-book-title{font-family:'Playfair Display',Georgia,serif;font-weight:900;font-size:clamp(1rem,3.2vh,2.1rem);color:#b8860b;text-align:center;padding:clamp(14px,3vh,36px) clamp(12px,3vw,36px);letter-spacing:1.5px;text-shadow:0 2px 4px rgba(0,0,0,.6);line-height:1.2}
.final-btn{font-family:'Playfair Display',Georgia,serif;font-size:clamp(.85rem,2vh,1.15rem);padding:clamp(8px,1.6vh,14px) clamp(20px,4vw,42px);background:#4caf50;color:#fff;border:2px solid #2e7d32;border-radius:8px;cursor:pointer;box-shadow:0 4px 0 #2e7d32,0 8px 16px rgba(0,0,0,.35);flex-shrink:0}
.final-btn:hover{background:#66bb6a}
.final-btn:active{transform:translateY(2px)}
.dict-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(26,42,74,.9);display:none;align-items:center;justify-content:center;z-index:2000}
.dict-overlay.active{display:flex}
.dict-container{width:94%;max-width:960px;height:88%;background:#e0d4b8;border-radius:8px;border:4px solid #1a2a4a;display:flex;flex-direction:column;overflow:hidden;position:relative}
.dict-header{display:flex;justify-content:space-between;align-items:center;padding:6px 14px;background:#1a2a4a;color:#e0d4b8;font-family:'Playfair Display',Georgia,serif;font-size:.95rem}
.dict-close{font-size:1.2rem;cursor:pointer;color:#e0d4b8;background:none;border:none}
.dict-pages{flex:1;display:flex;overflow:visible;position:relative}
.dict-page{flex:1;position:relative;padding:14px 24px 44px 18px;overflow-y:auto;overflow-x:visible;display:flex;flex-direction:column;background:#e0d4b8;background-image:radial-gradient(circle at 20% 30%,rgba(184,92,56,.1) .5px,transparent 1px),radial-gradient(circle at 70% 60%,rgba(166,138,58,.1) .5px,transparent 1px)}
.dict-page-content{flex:1;display:flex;flex-direction:column}
.dict-fold{width:6px;flex-shrink:0;background:linear-gradient(to right,#d4c8a8,#c8bc9c 30%,#b8ac8c 50%,#c8bc9c 70%,#d4c8a8);position:relative}
.dict-fold::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:2px;height:100%;background:rgba(0,0,0,.15)}
.dict-section-title{font-family:'Playfair Display',Georgia,serif;font-weight:900;font-size:2rem;color:#c0392b;margin:6px 0 8px;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.15);letter-spacing:1px}
.dict-page .arrow{position:absolute;bottom:10px;font-size:2rem;font-weight:800;color:#e74c3c;cursor:pointer;user-select:none;line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.dict-page .arrow:hover{color:#ff6b5b}
.dict-page .arrow.disabled{color:#d0a0a0;cursor:default;text-shadow:none}
.dict-page .arrow.back{left:16px}
.dict-page .arrow.forward{right:16px}
.dict-entry{display:flex;align-items:center;gap:6px;padding:4px 0;min-height:2rem;flex:0 0 auto}
.dict-entry .lock{font-size:.85rem;flex-shrink:0;width:20px;text-align:center}
.dict-entry .entry-phrase{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:1.05rem;color:#5a2a2a;flex:0 0 40%;line-height:1.15}
.dict-entry .entry-phrase i{font-style:italic;font-weight:400;opacity:.85}
