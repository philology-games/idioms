<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Фразеологизмы. Знаток</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background-color: #346a48;
  font-family: 'EB Garamond', Georgia, serif;
  height: 100%;
  overflow: hidden;
  color: #1a2a4a;
}
#rotateWrap {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  transform-origin: top left;
  background-color: #346a48;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.header { text-align: center; padding: 6px 0 4px; flex-shrink: 0; }
.header h1 {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1.6rem;
  font-weight: 900;
  color: #e6b800;
  letter-spacing: 2px;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
  margin-bottom: 4px;
}
.instruction {
  font-size: 0.85rem;
  color: #d4a843;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
}
.label-phrase, .label-meaning {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 4px;
  font-weight: 700;
  font-size: 0.78rem;
}
.label-phrase { background: linear-gradient(180deg, #c8d8ee 0%, #B0C4DE 100%); color: #1a2a4a; border: 1px solid #5a7a9a; }
.label-meaning { background: linear-gradient(180deg, #fae8c8 0%, #F5DEB3 100%); color: #1a2a4a; border: 1px solid #b8a060; }
.tabs-row {
  flex-shrink: 0;
  display: flex;
  justify-content: flex-start;
  gap: 6px;
  padding: 2px 16px 4px 16px;
}
.tabs-row.empty { display: none; }
.tab {
  font-family: 'EB Garamond', Georgia, serif;
  font-size: 0.8rem;
  font-weight: 600;
  padding: 3px 14px;
  background-color: #1a2a4a;
  color: #e0d4b8;
  border: 1px solid #b8860b;
  border-radius: 4px;
  cursor: pointer;
}
.tab.active { background-color: #b8860b; color: #1a2a4a; }
.tab:hover { background-color: #2a3a5a; }
.main {
  flex: 1;
  display: flex;
  gap: 10px;
  padding: 0 16px 6px 16px;
  min-height: 0;
}
.left-part {
  flex: 0 0 63%;
  min-height: 0;
  min-width: 0;
  display: flex;
}
.game-field {
  flex: 1;
  border: 3px solid #b8860b;
  border-radius: 8px;
  padding: var(--gap, 5px);
  display: grid;
  grid-template-columns: repeat(var(--cols, 5), minmax(0, 1fr));
  grid-auto-rows: minmax(0, 1fr);
  gap: var(--gap, 5px);
  min-height: 0;
  min-width: 0;
  overflow: hidden;
  position: relative;
  background-color: rgba(0,0,0,0.05);
}
.game-field .start-btn {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1rem;
  padding: 8px 24px;
  background-color: #2a4a6a;
  color: #e0d4b8;
  border: 2px solid #b8860b;
  border-radius: 6px;
  cursor: pointer;
  z-index: 10;
}
.game-field .start-btn:hover { background-color: #3a5a7a; }
.tile {
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  border-radius: 4px 6px 6px 4px;
  cursor: pointer;
  text-align: center;
  font-family: 'EB Garamond', Georgia, serif;
  font-size: 1.05rem;
  font-weight: 700;
  line-height: 1.1;
  user-select: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2px 4px;
  overflow: hidden;
  overflow-wrap: normal;
  word-break: keep-all;
  hyphens: none;
  -webkit-hyphens: none;
  position: relative;
  transition: box-shadow 0.15s, background-color 0.15s, border-color 0.15s, transform 0.15s;
  box-shadow:
    0 2px 0 rgba(0,0,0,0.2),
    0 3px 4px rgba(0,0,0,0.12),
    inset 0 2px 0 rgba(255,255,255,0.5),
    inset 0 -2px 0 rgba(0,0,0,0.1);
  border: 1px solid rgba(0,0,0,0.15);
}
.tile.phrase { background: linear-gradient(180deg, #c8d8ee 0%, #B0C4DE 50%, #9ab0cc 100%); color: #1a2a4a; }
.tile.meaning { background: linear-gradient(180deg, #fae8c8 0%, #F5DEB3 50%, #e8d0a0 100%); color: #1a2a4a; }
.tile.selected {
  border: 2px solid #b8860b;
  box-shadow: 0 0 0 2px #b8860b, 0 2px 0 rgba(0,0,0,0.2), 0 3px 4px rgba(0,0,0,0.12);
  transform: translateY(-2px);
}
.tile.correct {
  background: linear-gradient(180deg, #c8e6c9 0%, #a8d5a8 100%) !important;
  border: 2px solid #4caf50 !important;
  color: #1a2a4a !important;
}
.tile.wrong {
  background: linear-gradient(180deg, #ffcdd2 0%, #ef9a9a 100%) !important;
  border: 2px solid #c62828 !important;
  color: #1a2a4a !important;
}
.tile.hidden { visibility: hidden; pointer-events: none; }
.tile .m-line { display: block; }
.tile .m-line.second { color: #2a4a7a !important; }
.tile .m-line.third { color: #3a6a9a !important; }
@media (min-width: 1100px) {
  .tile { font-size: 1.5rem; }
}
@media (min-width: 750px) and (max-width: 1099px) {
  .tile { font-size: 1.2rem; }
}
@media (max-width: 749px) {
  .tile { font-size: 1.05rem; }
}
.right-column {
  flex: 0 0 37%;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 0;
  min-width: 0;
}
.stack {
  flex: 0 0 38%;
  display: flex;
  justify-content: center;
  align-items: center;
  border: 2px solid #b8860b;
  border-radius: 6px;
  background-color: rgba(0,0,0,0.08);
  padding: 8px;
  overflow: hidden;
}
.stack-inner {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 1px;
  width: 100%;
  height: 100%;
  align-content: center;
}
.stack-tile {
  aspect-ratio: 2 / 1;
  background: linear-gradient(180deg, #2a3a5a 0%, #1a2a4a 100%);
  border: 1px solid #b8860b;
  border-radius: 2px 3px 3px 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Playfair Display', Georgia, serif;
  font-weight: 900;
  color: #b8860b;
  font-size: 0.5rem;
  box-shadow: 0 1px 0 rgba(0,0,0,0.3);
}
.book-shelf {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  min-height: 0;
  min-width: 0;
  padding: 0 4px;
}
.book {
  position: relative;
  width: 100%;
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  min-height: 0;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
}
.book-open { position: relative; width: 100%; height: 78%; display: flex; flex-direction: column; }
.book-cover {
  position: absolute;
  top: -4px; left: -4px; right: -4px; bottom: -4px;
  background-color: #1a2a4a;
  border-radius: 4px;
  z-index: 1;
}
.book-pages-edge-top, .book-pages-edge-bottom {
  position: absolute;
  left: 3px; right: 3px;
  height: 4px;
  background: repeating-linear-gradient(to bottom, #e0d4b8, #e0d4b8 1px, #d4c8a8 1px, #d4c8a8 2px);
  z-index: 2;
}
.book-pages-edge-top { top: 0; border-radius: 2px 2px 0 0; }
.book-pages-edge-bottom { bottom: 0; border-radius: 0 0 2px 2px; }
.book-spread {
  position: relative;
  z-index: 3;
  display: flex;
  height: 100%;
  margin: 4px 3px;
  border-radius: 2px;
  overflow: hidden;
  perspective: 1600px;
}
.page {
  flex: 1;
  min-width: 0;
  background-color: #e0d4b8;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(184, 92, 56, 0.1) 0.5px, transparent 1px),
    radial-gradient(circle at 70% 60%, rgba(166, 138, 58, 0.1) 0.5px, transparent 1px);
  padding: 8px 6px;
  display: grid;
  grid-template-rows: repeat(5, minmax(0, 1fr));
  gap: 6px;
  overflow: hidden;
  position: relative;
}
.book-fold {
  width: 6px;
  flex-shrink: 0;
  background: linear-gradient(to right, #d4c8a8 0%, #c8bc9c 30%, #b8ac8c 50%, #c8bc9c 70%, #d4c8a8 100%);
  position: relative;
}
.book-fold::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 2px;
  height: 100%;
  background: rgba(0,0,0,0.15);
}
.book-pair {
  display: flex;
  flex-direction: row;
  gap: 2px;
  align-items: stretch;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}
.book-pair .pair-phrase {
  flex: 0 0 45%;
  min-width: 0;
  background-color: #c8e6c9;
  border: 1px solid #4caf50;
  border-radius: 3px;
  padding: 2px 4px;
  color: #152040;
  text-align: left;
  font-family: 'EB Garamond', Georgia, serif;
  font-weight: 700;
  font-size: 0.6rem;
  display: flex;
  align-items: center;
  position: relative;
  overflow: hidden;
  overflow-wrap: normal;
  word-break: keep-all;
}
.book-pair .pair-phrase .lamp-inline {
  font-size: 0.7rem;
  margin-left: 2px;
  cursor: pointer;
  flex-shrink: 0;
}
.book-pair .pair-dash {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  color: #152040;
  font-weight: 700;
  padding: 0 1px;
  font-size: 0.6rem;
}
.book-pair .pair-meaning {
  flex: 1;
  min-width: 0;
  background-color: #c8e6c9;
  border: 1px solid #4caf50;
  border-radius: 3px;
  padding: 2px 4px;
  color: #152040;
  text-align: left;
  font-size: 0.6rem;
  font-weight: 600;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  overflow: hidden;
  overflow-wrap: normal;
  word-break: keep-all;
}
.book-pair .pair-meaning .m-line { display: block; }
.book-pair .pair-meaning .second { color: #1a2a5a; }
.book-pair .pair-meaning .third { color: #2a3a7a; }
.shelf {
  position: relative;
  width: 100%;
  height: 14px;
  margin-top: 4px;
  background: linear-gradient(180deg, #a0552a 0%, #8b3a1a 15%, #6e2410 50%, #4a1408 85%, #2a0800 100%);
  border-radius: 3px 3px 4px 4px;
  box-shadow:
    0 2px 0 rgba(255,180,120,0.25) inset,
    0 -2px 4px rgba(0,0,0,0.4) inset,
    0 5px 10px rgba(0,0,0,0.45),
    0 1px 0 rgba(160,85,42,0.4);
}
.shelf::before {
  content: '';
  position: absolute;
  top: 0; left: 6px; right: 6px;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(255,200,150,0.5), transparent);
  border-radius: 1px;
}
.shelf::after {
  content: '';
  position: absolute;
  bottom: -3px; left: 3px; right: 3px;
  height: 3px;
  background: linear-gradient(180deg, #3a0e04 0%, #1a0400 100%);
  border-radius: 0 0 3px 3px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.5);
}
@keyframes flipPage {
  0% { transform: rotateY(0deg); }
  100% { transform: rotateY(-180deg); }
}
.flip-clone {
  position: absolute;
  top: 0;
  right: 0;
  width: 50%;
  height: 100%;
  transform-origin: left center;
  animation: flipPage 1.3s cubic-bezier(0.45, 0.05, 0.55, 0.95) forwards;
  z-index: 10;
  background-color: #e0d4b8;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(184, 92, 56, 0.1) 0.5px, transparent 1px),
    radial-gradient(circle at 70% 60%, rgba(166, 138, 58, 0.1) 0.5px, transparent 1px);
  padding: 8px 6px;
  display: grid;
  grid-template-rows: repeat(5, minmax(0, 1fr));
  gap: 6px;
  border-radius: 2px;
  box-shadow: 0 0 12px rgba(0,0,0,0.3);
  overflow: hidden;
}
.footer {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 16px;
}
.footer-buttons { display: flex; gap: 6px; }
.btn {
  font-family: 'EB Garamond', Georgia, serif;
  font-weight: 600;
  background-color: #1a2a4a;
  color: #e0d4b8;
  border: 1px solid #b8860b;
  border-radius: 5px;
  padding: 4px 10px;
  font-size: 0.7rem;
  cursor: pointer;
}
.btn:hover { background-color: #2a3a5a; }
.btn.muted { opacity: 0.6; }
.watermark {
  color: rgba(224, 212, 184, 0.9);
  font-size: 0.65rem;
  text-shadow: 0 1px 2px rgba(0,0,0,0.4);
}
.pause-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background-color: rgba(26, 42, 74, 0.7);
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  z-index: 1000;
}
.pause-overlay.active { display: flex; }
.pause-overlay .coffee { font-size: 5rem; margin-bottom: 20px; }
.pause-overlay .btn { font-size: 1rem; padding: 10px 30px; }
.tooltip {
  position: absolute;
  background-color: #f5f0e1;
  border: 2.5px solid #1a2a4a;
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 0.75rem;
  color: #1a2a4a;
  z-index: 100;
  box-shadow: 0 3px 10px rgba(0,0,0,0.35);
  max-width: 240px;
  line-height: 1.4;
}
.tooltip .example { font-style: italic; color: #1a2a4a; font-weight: 600; }
.tooltip .warning { display: block; margin-top: 3px; }
.final-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background-color: #346a48;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  z-index: 1500;
}
.final-overlay.active { display: flex; }
.final-book {
  width: 220px;
  height: 300px;
  background: linear-gradient(135deg, #1a2a4a 0%, #0d1b3e 100%);
  border-radius: 6px;
  border: 3px solid #b8860b;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 12px 30px rgba(0,0,0,0.5), inset 0 0 40px rgba(184, 134, 11, 0.15);
  position: relative;
  cursor: pointer;
  animation: bookAppear 0.8s ease-out;
}
@keyframes bookAppear {
  0% { transform: scale(0.3); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.final-book::before {
  content: '';
  position: absolute;
  left: 6px; top: 6px; bottom: 6px;
  width: 3px;
  background: rgba(184, 134, 11, 0.3);
  border-radius: 2px;
}
.final-book-title {
  font-family: 'Playfair Display', Georgia, serif;
  font-weight: 900;
  font-size: 1.2rem;
  color: #b8860b;
  text-align: center;
  padding: 20px;
  letter-spacing: 1px;
  text-shadow: 0 1px 2px rgba(0,0,0,0.5);
}
.final-btn {
  margin-top: 24px;
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1rem;
  padding: 12px 36px;
  background-color: #4caf50;
  color: #fff;
  border: 2px solid #2e7d32;
  border-radius: 8px;
  cursor: pointer;
  box-shadow: 0 4px 0 #2e7d32, 0 6px 12px rgba(0,0,0,0.3);
}
.final-btn:hover { background-color: #66bb6a; }
.final-btn:active { transform: translateY(2px); }
.final-header { position: absolute; top: 20px; left: 0; right: 0; text-align: center; }
.final-header h1 {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1.8rem;
  font-weight: 900;
  color: #e6b800;
  letter-spacing: 2px;
}
.final-footer {
  position: absolute;
  bottom: 20px; left: 0; right: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 20px;
}
.dict-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background-color: rgba(26, 42, 74, 0.9);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 2000;
}
.dict-overlay.active { display: flex; }
.dict-container {
  width: 92%;
  max-width: 820px;
  height: 88%;
  background-color: #e0d4b8;
  border-radius: 8px;
  border: 4px solid #1a2a4a;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}
.dict-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 14px;
  background-color: #1a2a4a;
  color: #e0d4b8;
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 0.95rem;
}
.dict-close {
  font-size: 1.2rem;
  cursor: pointer;
  color: #e0d4b8;
  background: none;
  border: none;
}
.dict-pages { flex: 1; display: flex; overflow: hidden; position: relative; }
.dict-page {
  flex: 1;
  position: relative;
  padding: 14px 18px 44px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  background-color: #e0d4b8;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(184, 92, 56, 0.1) 0.5px, transparent 1px),
    radial-gradient(circle at 70% 60%, rgba(166, 138, 58, 0.1) 0.5px, transparent 1px);
}
.dict-page-content { flex: 1; }
.dict-fold {
  width: 6px;
  flex-shrink: 0;
  background: linear-gradient(to right, #d4c8a8 0%, #c8bc9c 30%, #b8ac8c 50%, #c8bc9c 70%, #d4c8a8 100%);
  position: relative;
}
.dict-fold::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 2px;
  height: 100%;
  background: rgba(0,0,0,0.15);
}
.dict-page .arrow {
  position: absolute;
  bottom: 10px;
  font-size: 1.6rem;
  font-weight: 600;
  color: #c0392b;
  cursor: pointer;
  user-select: none;
  line-height: 1;
}
.dict-page .arrow:hover { color: #e74c3c; }
.dict-page .arrow.disabled { color: #d0a0a0; cursor: default; }
.dict-page .arrow.back { left: 16px; }
.dict-page .arrow.forward { right: 16px; }
.dict-entry {
  display: flex;
  align-items: baseline;
  gap: 6px;
  padding: 4px 0;
  border-bottom: 1px dotted rgba(0,0,0,0.1);
}
.dict-entry .lock { font-size: 0.85rem; flex-shrink: 0; width: 20px; }
.dict-entry .entry-phrase {
  font-family: 'Playfair Display', Georgia, serif;
  font-weight: 700;
  font-size: 1.1rem;
  color: #5a2a2a;
  flex: 0 0 auto;
  max-width: 45%;
}
.dict-entry .entry-phrase .lamp-inline {
  font-size: 0.95rem;
  margin-left: 3px;
  cursor: pointer;
}
.dict-entry .entry-dash { color: #1a2a4a; padding: 0 4px; }
.dict-entry .entry-meaning {
  font-family: 'EB Garamond', Georgia, serif;
  font-size: 1rem;
  font-weight: 600;
  color: #152040;
  flex: 1;
}
.dict-entry.empty .entry-phrase,
.dict-entry.empty .entry-dash,
.dict-entry.empty .entry-meaning { visibility: hidden; }
@media (orientation: portrait) and (min-width: 600px) and (max-width: 1100px) {
  .main {
    flex-direction: column;
    padding: 0 12px 5px 12px;
    gap: 6px;
  }
  .top-part {
    flex: 0 0 35%;
    display: flex;
    flex-direction: row;
    gap: 8px;
    min-height: 0;
    min-width: 0;
  }
  .top-part .stack {
    flex: 1;
    min-width: 0;
    height: 100%;
  }
  .top-part .book-shelf {
    flex: 1;
    min-width: 0;
    padding: 0 4px;
  }
  .top-part .book-open { height: 92%; }
  .main .left-part {
    flex: 1;
    width: 100%;
  }
  .game-field {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }
}
</style>
</head>
<body>

<div id="rotateWrap">
  <div class="header">
    <h1>Фразеологизмы. Знаток</h1>
    <p class="instruction">
      Соедините <span class="label-phrase">фразеологизм</span> и его <span class="label-meaning">значение</span>
    </p>

function isLandscape() { return window.innerWidth >= window.innerHeight; }
function getDeviceType() {
  const minSide = Math.min(window.innerWidth, window.innerHeight);
  if (minSide < 600) return 'phone';
  if (minSide < 900) return 'tablet';
  return 'desktop';
}
function getParams() {
  const device = getDeviceType();
  if (device === 'phone') {
    return { pairsPerRound: 6, tabs: 3, cols: 3, rows: 4, gap: 5, bookPairsPerPage: 5, totalTiles: 190 };
  }
  if (device === 'tablet') {
    return { pairsPerRound: 15, tabs: 3, cols: 5, rows: 6, gap: 5, bookPairsPerPage: 5, totalTiles: 190 };
  }
  return { pairsPerRound: 20, tabs: 1, cols: 5, rows: 8, gap: 6, bookPairsPerPage: 5, totalTiles: 568 };
}
function normalizeMeaning(meaning) {
  return meaning.toLowerCase().replace(/[;,.!?()]/g, ' ').split(/\s+/).filter(w => w.length > 2).sort().join(' ');
}
function meaningsAreSimilar(m1, m2) {
  const n1 = normalizeMeaning(m1), n2 = normalizeMeaning(m2);
  if (n1 === n2) return true;
  const w1 = new Set(n1.split(' ')), w2 = new Set(n2.split(' '));
  const inter = [...w1].filter(w => w2.has(w));
  const minSize = Math.min(w1.size, w2.size);
  return minSize > 0 && inter.length / minSize >= 0.6;
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function buildVariants() {
  const params = getParams();
  const shuffled = shuffle(ALL_PAIRS);
  const total = shuffled.length;
  const tabs = params.tabs;
  const perRound = params.pairsPerRound;
  const variantSize = Math.floor(total / tabs);
  const variantArrays = [];
  let start = 0;
  for (let i = 0; i < tabs; i++) {
    const size = (i === tabs - 1) ? (total - start) : variantSize;
    variantArrays.push(shuffled.slice(start, start + size));
    start += size;
  }
  return variantArrays.map(variant => {
    const rounds = [];
    const remaining = [...variant];
    while (remaining.length > 0) {
      const round = [];
      const used = new Set();
      for (let i = 0; i < remaining.length; i++) {
        if (round.length >= perRound) break;
        const candidate = remaining[i];
        if (used.has(i)) continue;
        let hasConflict = false;
        for (const existing of round) {
          if (meaningsAreSimilar(candidate.m, existing.m)) { hasConflict = true; break; }
        }
        if (!hasConflict) { round.push(candidate); used.add(i); }
      }
      if (round.length < perRound) {
        for (let i = 0; i < remaining.length; i++) {
          if (round.length >= perRound) break;
          if (used.has(i)) continue;
          round.push(remaining[i]); used.add(i);
        }
      }
      const newRemaining = [];
      remaining.forEach((item, i) => { if (!used.has(i)) newRemaining.push(item); });
      rounds.push(round);
      remaining.length = 0;
      remaining.push(...newRemaining);
    }
    return rounds;
  });
}

let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playWoodClick() {
  if (!soundOn) return;
  try {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    const nLen = Math.floor(ctx.sampleRate * 0.012);
    const nBuf = ctx.createBuffer(1, nLen, ctx.sampleRate);
    const nData = nBuf.getChannelData(0);
    for (let i = 0; i < nLen; i++) {
      const t = i / nLen;
      nData[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 4);
    }
    const nSrc = ctx.createBufferSource();
    nSrc.buffer = nBuf;
    const nBp = ctx.createBiquadFilter();
    nBp.type = 'bandpass';
    nBp.frequency.value = 1500;
    nBp.Q.value = 1.0;
    const nGain = ctx.createGain();
    nGain.gain.value = 0.28;
    nSrc.connect(nBp); nBp.connect(nGain); nGain.connect(ctx.destination);
    nSrc.start(now);
    const osc = ctx.createOscillator();
    const oGain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(340, now);
    osc.frequency.exponentialRampToValueAtTime(180, now + 0.04);
    oGain.gain.setValueAtTime(0.001, now);
    oGain.gain.exponentialRampToValueAtTime(0.14, now + 0.003);
    oGain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
    osc.connect(oGain); oGain.connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.05);
  } catch(e) {}
}
function playDiceDrop(count) {
  if (!soundOn) return;
  try {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    for (let k = 0; k < count; k++) {
      const t = now + k * 0.1 + Math.random() * 0.015;
      const freq = 900 + Math.random() * 600;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t);
      osc.frequency.exponentialRampToValueAtTime(freq * 0.55, t + 0.025);
      gain.gain.setValueAtTime(0.001, t);
      gain.gain.exponentialRampToValueAtTime(0.07, t + 0.002);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.035);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t); osc.stop(t + 0.04);
    }
  } catch(e) {}
}
function playFanfare() {
  if (!soundOn) return;
  try {
    const ctx = getAudioCtx();
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.1, ctx.currentTime + i * 0.15);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.15 + 0.4);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(ctx.currentTime + i * 0.15);
      osc.stop(ctx.currentTime + i * 0.15 + 0.4);
    });
  } catch(e) {}
}

const SHORT_WORDS = ['в','на','с','к','по','за','из','от','до','у','о','об','во','со','ко','под','над','при','про','без','для','через','между','перед','и','а','но','да','или','либо','что','как','то','же','бы','ли','не','ни'];
function addNbsp(text) {
  let result = text;
  SHORT_WORDS.forEach(word => {
    const regex = new RegExp('(^|\\s)(' + word + ')\\s+', 'gi');
    result = result.replace(regex, '$1$2&nbsp;');
  });
  return result;
}
function splitMeaning(meaning) { return meaning.split(';').map(s => s.trim()); }

/* Два значения — друг под другом через <br> */
function renderMeaningHTMLStacked(meaning) {
  const parts = splitMeaning(meaning);
  const classes = ['', 'second', 'third'];
  return parts.map((part, i) => {
    const cls = classes[i] || 'third';
    const sep = i < parts.length - 1 ? ';' : '';
    return `<span class="${cls}">${addNbsp(part)}${sep}</span>`;
  }).join('<br>');
}
/* В словаре — в одну строку */
function renderMeaningHTMLInline(meaning) {
  const parts = splitMeaning(meaning);
  const classes = ['', 'second', 'third'];
  return parts.map((part, i) => {
    const cls = classes[i] || 'third';
    const sep = i < parts.length - 1 ? ';' : '';
    return `<span class="${cls}">${addNbsp(part)}${sep}</span>`;
  }).join(' ');
}

/* АВТОПОДГОНКА ШРИФТА НА КОСТЯШКАХ */
function fitTiles() {
  const tiles = document.querySelectorAll('.tile');
  tiles.forEach(tile => {
    // сбрасываем на исходный размер
    tile.style.fontSize = '';
    const computed = parseFloat(getComputedStyle(tile).fontSize);
    const minSize = 9;
    let size = computed;
    let iteration = 0;
    // Проверяем, влезает ли содержимое
    while (
      (tile.scrollHeight > tile.clientHeight + 1 ||
       tile.scrollWidth > tile.clientWidth + 1) &&
      size > minSize && iteration < 25
    ) {
      size -= 0.5;
      tile.style.fontSize = size + 'px';
      iteration++;
    }
  });
}

function applyRotation() {
  const wrap = document.getElementById('rotateWrap');
  const isPhone = getDeviceType() === 'phone';
  const portrait = !isLandscape();
  if (isPhone && portrait) {
    const w = window.innerWidth;
    const h = window.innerHeight;
    wrap.style.width = h + 'px';
    wrap.style.height = w + 'px';
    wrap.style.transform = `translateX(${w}px) rotate(90deg)`;
  } else {
    wrap.style.width = '100%';
    wrap.style.height = '100%';
    wrap.style.transform = '';
  }

function applyPortraitTabletLayout() {
  const main = document.getElementById('mainArea');
  const leftPart = document.getElementById('leftPart');
  const rightColumn = document.getElementById('rightColumn');
  const stack = document.getElementById('stack');
  const bookShelf = document.getElementById('bookShelf');
  const isTabletPortrait = getDeviceType() === 'tablet' && !isLandscape();

  if (isTabletPortrait) {
    let topPart = document.getElementById('topPart');
    if (!topPart) {
      topPart = document.createElement('div');
      topPart.id = 'topPart';
      topPart.className = 'top-part';
      main.insertBefore(topPart, leftPart);
    }
    topPart.appendChild(stack);
    topPart.appendChild(bookShelf);
    rightColumn.style.display = 'none';
  } else {
    const topPart = document.getElementById('topPart');
    if (topPart) {
      rightColumn.style.display = 'flex';
      rightColumn.appendChild(stack);
      rightColumn.appendChild(bookShelf);
      topPart.remove();
    }
  }
}

function initGame() {
  deviceParams = getParams();
  variants = buildVariants();
  currentVariant = 0; currentRound = 0;
  pairsInBook = []; collectedPhrases = new Set();
  gameStarted = false; paused = false;
  selectedPhrase = null; selectedMeaning = null;
  isAnimating = false; isFlipping = false;
  stackRemaining = deviceParams.totalTiles;

  const tabsRow = document.getElementById('tabsRow');
  if (deviceParams.tabs > 1) tabsRow.classList.remove('empty');
  else tabsRow.classList.add('empty');

  document.querySelectorAll('.tab').forEach((tab, i) => {
    tab.style.display = i < deviceParams.tabs ? 'inline-block' : 'none';
    tab.classList.toggle('active', i === 0);
    tab.onclick = () => switchVariant(i);
  });

  const field = document.getElementById('gameField');
  field.style.setProperty('--cols', deviceParams.cols);
  field.style.setProperty('--gap', deviceParams.gap + 'px');
  field.innerHTML = '<button class="start-btn" id="startBtn" onclick="startGame()">Начать игру</button>';

  document.getElementById('pageLeft').innerHTML = '';
  document.getElementById('pageRight').innerHTML = '';
  bookLeftPairs = 0; bookRightPairs = 0;

  renderStack();
  applyPortraitTabletLayout();
  document.getElementById('pauseOverlay').classList.remove('active');
  document.getElementById('dictOverlay').classList.remove('active');
  document.getElementById('finalOverlay').classList.remove('active');
}

function switchVariant(index) {
  currentVariant = index; currentRound = 0;
  pairsInBook = []; collectedPhrases = new Set();
  gameStarted = false; isAnimating = false; isFlipping = false;
  selectedPhrase = null; selectedMeaning = null;
  stackRemaining = deviceParams.totalTiles;
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === index));
  const field = document.getElementById('gameField');
  field.innerHTML = '<button class="start-btn" id="startBtn" onclick="startGame()">Начать игру</button>';
  document.getElementById('pageLeft').innerHTML = '';
  document.getElementById('pageRight').innerHTML = '';
  bookLeftPairs = 0; bookRightPairs = 0;
  renderStack();
}

function startGame() {
  gameStarted = true;
  const btn = document.getElementById('startBtn');
  if (btn) btn.remove();
  nextRound();
}

function nextRound() {
  const rounds = variants[currentVariant];
  if (currentRound >= rounds.length) { showFinal(); return; }
  pairsOnField = [...rounds[currentRound]];
  const tilesThisRound = pairsOnField.length * 2;
  stackRemaining = Math.max(0, stackRemaining - tilesThisRound);
  renderStack();
  renderField();
  currentRound++;
}

function renderField() {
  const field = document.getElementById('gameField');
  field.innerHTML = '';
  const tiles = [];
  pairsOnField.forEach(pair => {
    tiles.push({ type: 'phrase', text: pair.p, pair });
    tiles.push({ type: 'meaning', text: pair.m, pair });
  });
  tiles.sort(() => Math.random() - 0.5);
  tiles.forEach((data) => {
    const tile = document.createElement('div');
    tile.className = 'tile ' + data.type;
    if (data.type === 'phrase') tile.innerHTML = addNbsp(data.text);
    else tile.innerHTML = renderMeaningHTMLStacked(data.text);
    tile.dataset.type = data.type;
    tile.dataset.phrase = data.pair.p;
    tile.dataset.meaning = data.pair.m;
    tile.onclick = () => selectTile(tile);
    field.appendChild(tile);
  });

  // Автоподгонка шрифта ДО анимации — чтобы размер был правильным
  fitTiles();

  const stackEl = document.getElementById('stack');
  const stackRect = stackEl.getBoundingClientRect();
  const stackCX = stackRect.left + stackRect.width / 2;
  const stackCY = stackRect.top + stackRect.height / 2;
  const allTiles = field.querySelectorAll('.tile');
  allTiles.forEach(tile => {
    const rect = tile.getBoundingClientRect();
    const dx = stackCX - (rect.left + rect.width / 2);
    const dy = stackCY - (rect.top + rect.height / 2);
    tile.style.transform = `translate(${dx}px, ${dy}px) scale(0.15)`;
    tile.style.opacity = '0';
    tile.style.transition = 'none';
  });
  playDiceDrop(allTiles.length);
  setTimeout(() => {
    allTiles.forEach((tile, i) => {
      setTimeout(() => {
        tile.style.transition = 'transform 0.55s cubic-bezier(0.2, 0.7, 0.3, 1), opacity 0.35s ease-out';
        tile.style.transform = 'translate(0, 0) scale(1)';
        tile.style.opacity = '1';
      }, i * 100);
    });
    const totalTime = allTiles.length * 100 + 700;
    setTimeout(() => {
      allTiles.forEach(tile => {
        tile.style.transition = '';
        tile.style.transform = '';
        tile.style.opacity = '';
      });
      // Пересчитываем ещё раз после анимации
      fitTiles();
    }, totalTime);
  }, 60);
}

function selectTile(tile) {
  if (paused || !gameStarted || isAnimating || isFlipping) return;
  if (tile.classList.contains('hidden')) return;
  playWoodClick();
  document.querySelectorAll('.tile').forEach(t => t.classList.remove('selected'));
  tile.classList.add('selected');
  if (tile.dataset.type === 'phrase') selectedPhrase = tile;
  else selectedMeaning = tile;
  if (selectedPhrase && selectedMeaning) checkPair();
}

function checkPair() {
  if (isAnimating) return;
  isAnimating = true;
  const p = selectedPhrase, m = selectedMeaning;
  if (p.dataset.phrase === m.dataset.phrase) {
    p.classList.add('correct'); m.classList.add('correct');
    p.classList.remove('selected'); m.classList.remove('selected');
    selectedPhrase = null; selectedMeaning = null;
    animateToBook(p, m);
  } else {
    p.classList.add('wrong'); m.classList.add('wrong');
    setTimeout(() => {
      p.classList.remove('wrong', 'selected');
      m.classList.remove('wrong', 'selected');
      selectedPhrase = null; selectedMeaning = null;
      isAnimating = false;
    }, 500);
  }
}

function animateToBook(p, m) {
  const bookRect = document.querySelector('.book').getBoundingClientRect();
  const pRect = p.getBoundingClientRect();
  const mRect = m.getBoundingClientRect();
  const pClone = p.cloneNode(true);
  const mClone = m.cloneNode(true);
  [pClone, mClone].forEach((clone, i) => {
    const rect = i === 0 ? pRect : mRect;
    clone.style.position = 'fixed';
    clone.style.left = rect.left + 'px';
    clone.style.top = rect.top + 'px';
    clone.style.width = rect.width + 'px';
    clone.style.height = rect.height + 'px';
    clone.style.zIndex = '9999';
    clone.style.transition = 'all 0.5s ease-in';
    clone.style.pointerEvents = 'none';
    document.body.appendChild(clone);
  });
  p.style.visibility = 'hidden';
  m.style.visibility = 'hidden';
  requestAnimationFrame(() => {
    const tx = bookRect.left + bookRect.width / 2;
    const ty = bookRect.top + bookRect.height / 2;
    pClone.style.left = (tx - 40) + 'px';
    pClone.style.top = (ty - 15) + 'px';
    pClone.style.width = '60px';
    pClone.style.height = '30px';
    pClone.style.opacity = '0';
    mClone.style.left = (tx + 5) + 'px';
    mClone.style.top = (ty - 15) + 'px';
    mClone.style.width = '60px';
    mClone.style.height = '30px';
    mClone.style.opacity = '0';
  });
  setTimeout(() => {
    pClone.remove(); mClone.remove();
    p.classList.add('hidden'); m.classList.add('hidden');
    addPairToBook(p.dataset.phrase, p.dataset.meaning);
    collectedPhrases.add(p.dataset.phrase);
    isAnimating = false;
    const remaining = document.querySelectorAll('.tile:not(.hidden)').length;
    if (remaining === 0) setTimeout(() => nextRound(), 800);
  }, 500);
}

function addPairToBook(phrase, meaning) {
  const pageLeft = document.getElementById('pageLeft');
  const pageRight = document.getElementById('pageRight');
  const perPage = deviceParams.bookPairsPerPage;
  const pairDiv = document.createElement('div');
  pairDiv.className = 'book-pair';
  const phraseDiv = document.createElement('div');
  phraseDiv.className = 'pair-phrase';
  phraseDiv.innerHTML = addNbsp(phrase);
  if (phrase === LAMP_PHRASE) {
    const lamp = document.createElement('span');
    lamp.className = 'lamp-inline';
    lamp.textContent = '💡';
    lamp.onclick = (e) => { e.stopPropagation(); showTooltip(lamp); };
    phraseDiv.appendChild(lamp);
  }
  const dashDiv = document.createElement('div');
  dashDiv.className = 'pair-dash';
  dashDiv.textContent = '—';
  const meaningDiv = document.createElement('div');
  meaningDiv.className = 'pair-meaning';
  // В книге тоже два значения друг под другом
  meaningDiv.innerHTML = renderMeaningHTMLStacked(meaning);
  pairDiv.appendChild(phraseDiv);
  pairDiv.appendChild(dashDiv);
  pairDiv.appendChild(meaningDiv);

  if (bookLeftPairs < perPage) {
    pageLeft.appendChild(pairDiv);
    bookLeftPairs++;
  } else if (bookRightPairs < perPage) {
    pageRight.appendChild(pairDiv);
    bookRightPairs++;
  }
  pairsInBook.push({ phrase, meaning });

  if (bookLeftPairs >= perPage && bookRightPairs >= perPage) {
    isFlipping = true;
    setTimeout(() => {
      flipBookPage(() => {
        pageLeft.innerHTML = '';
        pageRight.innerHTML = '';
        bookLeftPairs = 0;
        bookRightPairs = 0;
        isFlipping = false;
      });
    }, 700);
  }
}

function flipBookPage(callback) {
  const spread = document.getElementById('bookSpread');
  const rightPage = document.getElementById('pageRight');
  const rightRect = rightPage.getBoundingClientRect();
  const spreadRect = spread.getBoundingClientRect();
  const clone = rightPage.cloneNode(true);
  clone.classList.add('flip-clone');
  clone.style.position = 'absolute';
  clone.style.left = (rightRect.left - spreadRect.left) + 'px';
  clone.style.top = '0';
  clone.style.width = rightRect.width + 'px';
  clone.style.height = '100%';
  spread.appendChild(clone);
  setTimeout(() => { clone.remove(); if (callback) callback(); }, 1300);
}

function showFinal() {
  document.getElementById('rotateWrap').style.display = 'none';
  document.getElementById('finalOverlay').classList.add('active');
  playFanfare();
}

let dictPages = [];
let dictCurrentPage = 0;
function buildDictPages() {
  const sorted = [...ALL_PAIRS].sort((a, b) => a.p.localeCompare(b.p, 'ru'));
  const groups = {};
  sorted.forEach(pair => {
    const letter = pair.p[0].toUpperCase();
    if (!groups[letter]) groups[letter] = [];
    groups[letter].push(pair);
  });
  const letters = Object.keys(groups).sort((a, b) => a.localeCompare(b, 'ru'));
  const entries = [];
  letters.forEach(letter => {
    entries.push({ type: 'letter', letter });
    groups[letter].forEach(pair => entries.push({ type: 'pair', pair }));
  });
  const pages = [];
  let currentPage = [], count = 0;
  entries.forEach(entry => {
    currentPage.push(entry); count++;
    if (count >= 20) { pages.push(currentPage); currentPage = []; count = 0; }
  });
  if (currentPage.length > 0) pages.push(currentPage);
  dictPages = pages;
}
function capitalizeFirst(str) {
  if (!str) return str;
  return str.charAt(0).toUpperCase() + str.slice(1);
}
function renderDictPage() {
  const leftContent = document.getElementById('dictPageLeftContent');
  const rightContent = document.getElementById('dictPageRightContent');
  leftContent.innerHTML = ''; rightContent.innerHTML = '';
  const page = dictPages[dictCurrentPage];
  if (!page) return;
  const half = Math.ceil(page.length / 2);
  const leftEntries = page.slice(0, half);
  const rightEntries = page.slice(half);
  [leftEntries, rightEntries].forEach((entries, side) => {
    const content = side === 0 ? leftContent : rightContent;
    entries.forEach(entry => {
      if (entry.type === 'letter') {
        const div = document.createElement('div');
        div.className = 'dict-section-title';
        div.textContent = entry.letter;
        content.appendChild(div);
      } else {
        const pair = entry.pair;
        const collected = collectedPhrases.has(pair.p);
        const div = document.createElement('div');
        div.className = 'dict-entry' + (collected ? '' : ' empty');
        const lock = document.createElement('span');
        lock.className = 'lock';
        lock.textContent = collected ? '' : '🔒';
        const phrase = document.createElement('span');
        phrase.className = 'entry-phrase';
        phrase.innerHTML = addNbsp(capitalizeFirst(pair.p));
        if (collected && pair.p === LAMP_PHRASE) {
          const lamp = document.createElement('span');
          lamp.className = 'lamp-inline';
          lamp.textContent = '💡';
          lamp.onclick = (e) => { e.stopPropagation(); showTooltip(lamp); };
          phrase.appendChild(lamp);
        }
        const dash = document.createElement('span');
        dash.className = 'entry-dash';
        dash.textContent = collected ? '—' : '';
        const meaning = document.createElement('span');
        meaning.className = 'entry-meaning';
        meaning.innerHTML = collected ? renderMeaningHTMLInline(pair.m) : '';
        div.appendChild(lock); div.appendChild(phrase); div.appendChild(dash); div.appendChild(meaning);
        content.appendChild(div);
      }
    });
  });
  const backArrow = document.getElementById('dictArrowBack');
  const forwardArrow = document.getElementById('dictArrowForward');
  backArrow.classList.toggle('disabled', dictCurrentPage === 0);
  forwardArrow.classList.toggle('disabled', dictCurrentPage >= dictPages.length - 1);
}
function openDict() {
  buildDictPages(); dictCurrentPage = 0; renderDictPage();
  document.getElementById('dictOverlay').classList.add('active');
}
function closeDict() { document.getElementById('dictOverlay').classList.remove('active'); }
function dictPrevPage() { if (dictCurrentPage > 0) { dictCurrentPage--; renderDictPage(); } }
function dictNextPage() { if (dictCurrentPage < dictPages.length - 1) { dictCurrentPage++; renderDictPage(); } }

function toggleSound() {
  soundOn = !soundOn;
  const btn1 = document.getElementById('soundBtn');
  const btn2 = document.getElementById('soundBtnFinal');
  const text = soundOn ? 'Звук 🔊' : 'Звук 🔇';
  [btn1, btn2].forEach(b => {
    if (b) {
      b.textContent = text;
      b.classList.toggle('muted', !soundOn);
    }
  });
}
function togglePause() {
  paused = !paused;
  const overlay = document.getElementById('pauseOverlay');
  if (paused) overlay.classList.add('active');
  else overlay.classList.remove('active');
}
function restartGame() {
  document.getElementById('finalOverlay').classList.remove('active');
  document.getElementById('rotateWrap').style.display = 'flex';
  initGame();
  applyRotation();
}

applyRotation();
initGame();

let resizeTimeout;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(() => {
    applyRotation();
    const newParams = getParams();
    if (newParams.cols !== deviceParams.cols ||
        newParams.rows !== deviceParams.rows ||
        newParams.pairsPerRound !== deviceParams.pairsPerRound) {
      initGame();
    }
  }, 300);
});
window.addEventListener('orientationchange', () => {
  setTimeout(() => { applyRotation(); initGame(); }, 300);
});
</script>
