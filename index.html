<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Тест поворота</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#333;font-family:monospace}
  #box{
    position:fixed;top:0;left:0;
    width:100%;height:100%;
    transform-origin:top left;
    background:#111;
    color:#fff;
    display:flex;flex-direction:column;
    font-size:14vw;
  }
  .top{background:#d33;flex:1;display:flex;align-items:center;justify-content:center;color:#fff}
  .mid{background:#3d3;flex:1;display:flex;align-items:center;justify-content:center;color:#111}
  .bot{background:#33d;flex:1;display:flex;align-items:center;justify-content:center;color:#fff}
  #info{
    position:fixed;top:4px;left:6px;
    background:#000;color:#ff0;
    font-size:12px;padding:4px 8px;border-radius:4px;
    z-index:9999;font-family:monospace;
  }
  #switchBtn{
    position:fixed;bottom:6px;left:6px;
    background:#ff0;color:#000;border:none;
    padding:8px 14px;font-size:16px;border-radius:4px;
    z-index:9999;cursor:pointer;font-family:monospace;
  }
</style>
</head>
<body>

<div id="info">загрузка…</div>
<button id="switchBtn">Следующий вариант</button>

<div id="box">
  <div class="top">ВЕРХ</div>
  <div class="mid">ЦЕНТР</div>
  <div class="bot">НИЗ</div>
</div>


<script>
const box=document.getElementById('box');
const info=document.getElementById('info');
const btn=document.getElementById('switchBtn');

// Ориентация при загрузке — фиксируем
let LOCKED_LANDSCAPE = window.innerWidth >= window.innerHeight;

function apply(){
  const wi = window.innerWidth;
  const hi = window.innerHeight;
  const currentIsLandscape = wi >= hi;

  box.style.transformOrigin = 'top left';

  if (currentIsLandscape === LOCKED_LANDSCAPE) {
    // ориентация совпадает — ничего не крутим
    box.style.width = '100%';
    box.style.height = '100%';
    box.style.transform = '';
    info.textContent =
      'без поворота, ориентация совпадает';
  } else {
    // ориентация не совпадает — поворачиваем и меняем местами размеры
    box.style.width = hi + 'px';
    box.style.height = wi + 'px';
    box.style.transform = `translate(${hi}px, 0) rotate(90deg)`;
    info.textContent =
      'translate(' + hi + ', 0) rotate(90deg)   wi=' + wi + '  hi=' + hi;
  }
}

btn.style.display = 'none';

window.addEventListener('resize', apply);
window.addEventListener('orientationchange', () => setTimeout(apply, 100));

apply();
</script>
</body>
</html>
